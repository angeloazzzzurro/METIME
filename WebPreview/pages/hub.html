<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>METIME - Casa</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:#D8C8B4;min-height:100vh;
      display:flex;align-items:flex-start;justify-content:center;
    }
    .phone{
      width:390px;max-width:100vw;min-height:100vh;
      background:#F5EDE0;
      overflow:hidden;display:flex;flex-direction:column;
    }

    /* ── Top bar ── */
    .top-bar{
      padding:52px 16px 10px;
      background:#F5EDE0;
      flex-shrink:0;
    }
    .top-row{display:flex;align-items:center;margin-bottom:12px;}
    .app-logo{
      display:flex;align-items:center;gap:6px;
      font-size:17px;font-weight:900;color:#2c1a0e;letter-spacing:-.2px;
    }
    .weather-btn{
      margin-left:auto;
      display:flex;align-items:center;gap:5px;
      padding:8px 16px;border-radius:999px;
      border:1.5px solid #F59E0B;
      background:rgba(255,255,255,.75);
      font-size:12px;font-weight:700;color:#D97706;
      cursor:pointer;white-space:nowrap;
    }
    .sections-scroll{
      display:flex;gap:8px;overflow-x:auto;
      padding-bottom:2px;scrollbar-width:none;
    }
    .sections-scroll::-webkit-scrollbar{display:none;}
    .sec-btn{
      display:flex;align-items:center;gap:5px;
      padding:9px 14px;border-radius:999px;
      font-size:12.5px;font-weight:700;font-family:inherit;
      cursor:pointer;white-space:nowrap;
      background:rgba(255,255,255,.75);
      border:1.5px solid rgba(0,0,0,.08);
      text-decoration:none;transition:all .15s;flex-shrink:0;
    }
    /* per-section active colours */
    .sec-btn[data-s="casa"]     {color:#B05050;}
    .sec-btn[data-s="giardino"] {color:#3A8A3A;}
    .sec-btn[data-s="giochi"]   {color:#6050B0;}
    .sec-btn[data-s="diario"]   {color:#3060A0;}
    .sec-btn[data-s="store"]    {color:#9A5020;}
    .sec-btn[data-s="zaino"]    {color:#4060A0;}
    .sec-btn[data-s="decora"]   {color:#8050B0;}
    .sec-btn[data-s="metime"]   {color:#B04070;}
    .sec-btn[data-s="rituale"]  {color:#B07070;}
    .sec-btn[data-s="mappa"]    {color:#507060;}
    .sec-btn[data-s="cucina"]   {color:#A05018;}
    .sec-btn[data-s="fattoria"] {color:#3A7010;}
    .sec-btn.active[data-s="casa"]     {background:#FFDDDD;border-color:transparent;}
    .sec-btn.active[data-s="giardino"] {background:#D6F0D6;border-color:transparent;}
    .sec-btn.active[data-s="giochi"]   {background:#E8D8F8;border-color:transparent;}
    .sec-btn.active[data-s="diario"]   {background:#D4E8F8;border-color:transparent;}
    .sec-btn.active[data-s="store"]    {background:#F8E8D4;border-color:transparent;}
    .sec-btn.active[data-s="rituale"]  {background:#FDE8E8;border-color:transparent;}
    .si{font-size:14px;}

    /* ── Care card ── */
    .care-card{
      margin:4px 12px 10px;
      background:#fff;border-radius:22px;
      padding:14px 16px 12px;
      box-shadow:0 4px 18px rgba(61,43,31,.10);
      flex-shrink:0;
    }
    .care-top{
      display:flex;align-items:flex-start;
      justify-content:space-between;margin-bottom:3px;
    }
    .care-title{font-size:21px;font-weight:900;color:#2c1a0e;letter-spacing:-.3px;}
    .care-currency{display:flex;align-items:center;gap:8px;padding-top:3px;}
    .curr-item{
      display:flex;align-items:center;gap:3px;
      font-size:13px;font-weight:800;color:#3d2b1f;
    }
    .curr-item .ci{font-size:14px;}
    .care-subtitle{font-size:12px;color:#9a7a5a;font-weight:500;line-height:1.4;margin-bottom:12px;}

    /* needs */
    .needs-row{display:flex;gap:6px;margin-bottom:13px;}
    .nbar{flex:1;display:flex;flex-direction:column;gap:5px;}
    .nbar-lbl{display:flex;align-items:center;gap:3px;font-size:10px;font-weight:700;}
    .nbar-track{height:7px;border-radius:999px;background:rgba(0,0,0,.07);overflow:hidden;}
    .nbar-fill{height:100%;border-radius:999px;}

    /* action circles */
    .acts-row{display:flex;justify-content:space-between;}
    .abt{
      display:flex;flex-direction:column;align-items:center;gap:5px;
      flex:1;border:0;background:none;cursor:pointer;padding:0;
    }
    .abt:active .acircle{transform:scale(.87);}
    .acircle{
      width:54px;height:54px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;font-size:24px;
      transition:transform .15s;
      box-shadow:0 4px 12px rgba(0,0,0,.13);
    }
    .albl{font-size:9.5px;font-weight:800;line-height:1.25;text-align:center;max-width:60px;}

    /* ── Room ── */
    .room-wrap{
      flex:1;overflow:hidden;
      background:#F5EDE0;
      position:relative;min-height:200px;
    }
    #house{width:100%;height:100%;display:block;}

    /* ── Bottom bar ── */
    .bottom-bar{
      display:flex;gap:8px;
      padding:10px 14px 28px;
      flex-shrink:0;background:#F5EDE0;
    }
    .bot-btn{
      flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
      padding:14px 8px;border-radius:999px;border:none;
      font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;
      transition:transform .13s;
    }
    .bot-btn:active{transform:scale(.92);}
    .bot-sfida   {background:#FFF3CC;color:#B07800;}
    .bot-shop    {background:#CCF0E8;color:#1A7060;}
    .bot-missioni{background:#EAD8F8;color:#6040A0;}
    .bot-icon{font-size:16px;}
  </style>
</head>
<body>
<div class="phone">

  <!-- Top bar -->
  <div class="top-bar">
    <div class="top-row">
      <div class="app-logo">🧡 METIME</div>
      <div class="weather-btn">☀️ Sunny</div>
    </div>
    <div class="sections-scroll">
      <a class="sec-btn active" data-s="casa"     href="hub.html"        ><span class="si">🏠</span> Casa</a>
      <a class="sec-btn"        data-s="giardino" href="home-pet.html"    ><span class="si">🌿</span> Giardino</a>
      <a class="sec-btn"        data-s="giochi"   href="#"               ><span class="si">🎮</span> Giochi</a>
      <a class="sec-btn"        data-s="diario"   href="journal.html"    ><span class="si">📖</span> Diario</a>
      <a class="sec-btn"        data-s="store"    href="shop.html"       ><span class="si">🛒</span> Store</a>
      <a class="sec-btn"        data-s="zaino"    href="#"               ><span class="si">🎒</span> Zaino</a>
      <a class="sec-btn"        data-s="decora"   href="#"               ><span class="si">🪑</span> Decora</a>
      <a class="sec-btn"        data-s="metime"   href="#"               ><span class="si">☕</span> Me Time</a>
      <a class="sec-btn"        data-s="rituale"  href="care-ritual.html"><span class="si">💗</span> Rituale</a>
      <a class="sec-btn"        data-s="mappa"    href="#"               ><span class="si">🗺️</span> Mappa</a>
      <a class="sec-btn"        data-s="cucina"   href="#"               ><span class="si">🍴</span> Cucina</a>
      <a class="sec-btn"        data-s="fattoria" href="#"               ><span class="si">🌾</span> Fattoria</a>
    </div>
  </div>

  <!-- Care card -->
  <div class="care-card">
    <div class="care-top">
      <div class="care-title">Cura del pet</div>
      <div class="care-currency">
        <div class="curr-item"><span class="ci">🪙</span> 240</div>
        <div class="curr-item"><span class="ci">⭐</span> Lv. 2</div>
      </div>
    </div>
    <div class="care-subtitle">Fai felice il tuo pet e guardalo crescere!</div>

    <div class="needs-row">
      <div class="nbar">
        <div class="nbar-lbl" style="color:#F97316">🍖 <span>Fame</span></div>
        <div class="nbar-track"><div class="nbar-fill" style="width:65%;background:linear-gradient(to right,#FB923C,#F97316)"></div></div>
      </div>
      <div class="nbar">
        <div class="nbar-lbl" style="color:#EC4899">💗 <span>Amore</span></div>
        <div class="nbar-track"><div class="nbar-fill" style="width:45%;background:linear-gradient(to right,#F472B6,#EC4899)"></div></div>
      </div>
      <div class="nbar">
        <div class="nbar-lbl" style="color:#34D399">⚡ <span>Energia</span></div>
        <div class="nbar-track"><div class="nbar-fill" style="width:80%;background:linear-gradient(to right,#6EE7B7,#34D399)"></div></div>
      </div>
      <div class="nbar">
        <div class="nbar-lbl" style="color:#60A5FA">💧 <span>Igiene</span></div>
        <div class="nbar-track"><div class="nbar-fill" style="width:28%;background:linear-gradient(to right,#93C5FD,#60A5FA)"></div></div>
      </div>
    </div>

    <div class="acts-row">
      <button class="abt">
        <div class="acircle" style="background:linear-gradient(145deg,#FB923C,#EA6A0A)">🥕</div>
        <span class="albl" style="color:#F97316">Nutrì</span>
      </button>
      <button class="abt">
        <div class="acircle" style="background:linear-gradient(145deg,#F472B6,#DA1E8A)">💗</div>
        <span class="albl" style="color:#EC4899">Gioca</span>
      </button>
      <button class="abt">
        <div class="acircle" style="background:linear-gradient(145deg,#A78BFA,#7C3AED)">✨</div>
        <span class="albl" style="color:#8B5CF6">Coccola</span>
      </button>
      <button class="abt">
        <div class="acircle" style="background:linear-gradient(145deg,#60A5FA,#2563EB)">🛁</div>
        <span class="albl" style="color:#3B82F6">Pulisci</span>
      </button>
      <button class="abt">
        <div class="acircle" style="background:linear-gradient(145deg,#34D399,#059669)">🌙</div>
        <span class="albl" style="color:#10B981">Metti a nanna</span>
      </button>
    </div>
  </div>

  <!-- Pixel-art isometric room -->
  <div class="room-wrap">
    <svg id="house" viewBox="0 0 390 360" preserveAspectRatio="xMidYMin slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- left wall clip -->
        <clipPath id="lc"><polygon points="10,132 195,30 195,210 10,312"/></clipPath>
        <!-- right wall clip -->
        <clipPath id="rc"><polygon points="380,132 195,30 195,210 380,312"/></clipPath>
        <!-- floor clip -->
        <clipPath id="fc"><polygon points="10,312 195,210 380,312 195,415"/></clipPath>
        <!-- glow for fairy lights -->
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFE87A" stop-opacity="1"/>
          <stop offset="100%" stop-color="#FFE87A" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- background -->
      <rect width="390" height="360" fill="#F5EDE0"/>

      <!-- ─── LEFT WALL (pink) ─── -->
      <polygon points="10,132 195,30 195,210 10,312" fill="#FFCECE"/>
      <g clip-path="url(#lc)">
        <!-- darker stripe every 20px -->
        <rect x="30"  y="0" width="10" height="400" fill="#F0AAAA" opacity=".55"/>
        <rect x="54"  y="0" width="10" height="400" fill="#F0AAAA" opacity=".55"/>
        <rect x="78"  y="0" width="10" height="400" fill="#F0AAAA" opacity=".55"/>
        <rect x="102" y="0" width="10" height="400" fill="#F0AAAA" opacity=".55"/>
        <rect x="126" y="0" width="10" height="400" fill="#F0AAAA" opacity=".55"/>
        <rect x="150" y="0" width="10" height="400" fill="#F0AAAA" opacity=".55"/>
        <rect x="174" y="0" width="10" height="400" fill="#F0AAAA" opacity=".55"/>
        <!-- slight depth gradient -->
        <polygon points="10,132 195,30 195,210 10,312"
          fill="url(#lwShade)" opacity=".15"/>
      </g>
      <!-- left wall edge lines -->
      <line x1="10" y1="132" x2="195" y2="30" stroke="#E8A0A0" stroke-width="1.5"/>
      <line x1="10" y1="132" x2="10"  y2="312" stroke="#D89090" stroke-width="1.5"/>

      <!-- ─── RIGHT WALL (lavender) ─── -->
      <polygon points="380,132 195,30 195,210 380,312" fill="#D8CCEE"/>
      <g clip-path="url(#rc)">
        <rect x="200" y="0" width="10" height="400" fill="#C0B0DC" opacity=".55"/>
        <rect x="224" y="0" width="10" height="400" fill="#C0B0DC" opacity=".55"/>
        <rect x="248" y="0" width="10" height="400" fill="#C0B0DC" opacity=".55"/>
        <rect x="272" y="0" width="10" height="400" fill="#C0B0DC" opacity=".55"/>
        <rect x="296" y="0" width="10" height="400" fill="#C0B0DC" opacity=".55"/>
        <rect x="320" y="0" width="10" height="400" fill="#C0B0DC" opacity=".55"/>
        <rect x="344" y="0" width="10" height="400" fill="#C0B0DC" opacity=".55"/>
        <rect x="368" y="0" width="10" height="400" fill="#C0B0DC" opacity=".55"/>
      </g>
      <line x1="380" y1="132" x2="195" y2="30"  stroke="#B8A8D8" stroke-width="1.5"/>
      <line x1="380" y1="132" x2="380" y2="312" stroke="#A898C8" stroke-width="1.5"/>

      <!-- ─── FLOOR (cream) ─── -->
      <polygon points="10,312 195,210 380,312 195,414" fill="#F0E8D8"/>
      <g clip-path="url(#fc)">
        <!-- subtle floor grid -->
        <line x1="10"  y1="312" x2="380" y2="312" stroke="#DDD0C0" stroke-width=".8"/>
        <line x1="102" y1="258" x2="288" y2="258" stroke="#DDD0C0" stroke-width=".6" opacity=".6"/>
        <line x1="195" y1="210" x2="380" y2="312" stroke="#DDD0C0" stroke-width=".8"/>
        <line x1="195" y1="210" x2="10"  y2="312" stroke="#DDD0C0" stroke-width=".8"/>
      </g>
      <line x1="10"  y1="312" x2="195" y2="210" stroke="#D8CCBC" stroke-width="1"/>
      <line x1="380" y1="312" x2="195" y2="210" stroke="#D8CCBC" stroke-width="1"/>

      <!-- ─── FAIRY LIGHTS (top ridge) ─── -->
      <!-- left ridge dots -->
      <circle cx="32"  cy="118" r="5" fill="#FFE87A" opacity=".7"/>
      <circle cx="32"  cy="118" r="2.5" fill="#FFE040"/>
      <circle cx="58"  cy="104" r="5" fill="#FFE87A" opacity=".7"/>
      <circle cx="58"  cy="104" r="2.5" fill="#FFE040"/>
      <circle cx="84"  cy="90"  r="5" fill="#FFE87A" opacity=".7"/>
      <circle cx="84"  cy="90"  r="2.5" fill="#FFE040"/>
      <circle cx="110" cy="76"  r="5" fill="#FFE87A" opacity=".7"/>
      <circle cx="110" cy="76"  r="2.5" fill="#FFE040"/>
      <circle cx="136" cy="62"  r="5" fill="#FFE87A" opacity=".7"/>
      <circle cx="136" cy="62"  r="2.5" fill="#FFE040"/>
      <circle cx="162" cy="48"  r="5" fill="#FFE87A" opacity=".7"/>
      <circle cx="162" cy="48"  r="2.5" fill="#FFE040"/>
      <!-- right ridge dots -->
      <circle cx="228" cy="48"  r="5" fill="#FFE87A" opacity=".7"/>
      <circle cx="228" cy="48"  r="2.5" fill="#FFE040"/>
      <circle cx="254" cy="62"  r="5" fill="#FFE87A" opacity=".7"/>
      <circle cx="254" cy="62"  r="2.5" fill="#FFE040"/>
      <circle cx="280" cy="76"  r="5" fill="#FFE87A" opacity=".7"/>
      <circle cx="280" cy="76"  r="2.5" fill="#FFE040"/>
      <circle cx="306" cy="90"  r="5" fill="#FFE87A" opacity=".7"/>
      <circle cx="306" cy="90"  r="2.5" fill="#FFE040"/>
      <circle cx="332" cy="104" r="5" fill="#FFE87A" opacity=".7"/>
      <circle cx="332" cy="104" r="2.5" fill="#FFE040"/>
      <circle cx="358" cy="118" r="5" fill="#FFE87A" opacity=".7"/>
      <circle cx="358" cy="118" r="2.5" fill="#FFE040"/>
      <!-- string lines -->
      <polyline points="10,132 32,118 58,104 84,90 110,76 136,62 162,48 195,30"
        fill="none" stroke="#C8A860" stroke-width=".8" opacity=".5"/>
      <polyline points="380,132 358,118 332,104 306,90 280,76 254,62 228,48 195,30"
        fill="none" stroke="#C8A860" stroke-width=".8" opacity=".5"/>

      <!-- ─── WINDOW (right wall) ─── -->
      <!-- outer frame -->
      <rect x="268" y="86" width="64" height="72" rx="32" ry="6" fill="#A08848"/>
      <!-- glass -->
      <rect x="273" y="90" width="54" height="64" rx="27" ry="4" fill="#1A2E50"/>
      <!-- stars -->
      <circle cx="283" cy="102" r="1.5" fill="white" opacity=".9"/>
      <circle cx="300" cy="98"  r="1"   fill="white" opacity=".8"/>
      <circle cx="316" cy="104" r="1.5" fill="white" opacity=".9"/>
      <circle cx="310" cy="92"  r="1"   fill="white" opacity=".7"/>
      <circle cx="322" cy="115" r="1"   fill="white" opacity=".8"/>
      <!-- moon -->
      <circle cx="300" cy="130" r="13"  fill="#F4E068"/>
      <circle cx="306" cy="126" r="12"  fill="#1A2E50"/>
      <!-- window sill -->
      <rect x="264" y="154" width="72" height="8" rx="4" fill="#B89848"/>

      <!-- ─── PLANT (left floor) ─── -->
      <!-- pot -->
      <ellipse cx="78" cy="294" rx="22" ry="9" fill="#D49090"/>
      <rect x="60" y="275" width="36" height="22" rx="4" fill="#D49090"/>
      <ellipse cx="78" cy="275" rx="18" ry="7" fill="#E0A0A0"/>
      <!-- leaves -->
      <ellipse cx="72" cy="250" rx="10" ry="26"
        fill="#4CAF50" transform="rotate(-20,72,250)"/>
      <ellipse cx="84" cy="245" rx="10" ry="26"
        fill="#45A049" transform="rotate(20,84,245)"/>
      <ellipse cx="78" cy="242" rx="8"  ry="22"
        fill="#56C258"/>
      <!-- stem -->
      <line x1="78" y1="274" x2="78" y2="258" stroke="#3A8A3A" stroke-width="2"/>

      <!-- ─── PET BED (right floor) ─── -->
      <!-- outer cushion -->
      <ellipse cx="302" cy="288" rx="38" ry="20" fill="#F0A0BC"/>
      <!-- rim shadow -->
      <ellipse cx="302" cy="291" rx="34" ry="16" fill="#E090AC"/>
      <!-- inner depression -->
      <ellipse cx="302" cy="287" rx="28" ry="13" fill="#F8C0D0"/>
      <!-- heart -->
      <text x="302" y="292" text-anchor="middle" font-size="14" fill="rgba(255,255,255,.85)">♥</text>

      <!-- ─── RUG (center floor) ─── -->
      <!-- outer ring -->
      <ellipse cx="195" cy="305" rx="42" ry="22" fill="#EED8A8"/>
      <!-- inner ring -->
      <ellipse cx="195" cy="305" rx="34" ry="17" fill="#F8ECC0"/>
      <!-- heart -->
      <text x="195" y="311" text-anchor="middle" font-size="16" fill="#D4904A">♥</text>

      <!-- ─── PIXEL ART CAT ─── -->
      <!-- shadow on floor -->
      <ellipse cx="195" cy="276" rx="34" ry="10" fill="rgba(100,60,160,.15)"/>

      <!-- body (rounded blob) -->
      <ellipse cx="195" cy="252" rx="34" ry="28" fill="#9B6BC8"/>
      <!-- body highlight -->
      <ellipse cx="185" cy="240" rx="14" ry="10" fill="#B08ADE" opacity=".4"/>

      <!-- left ear -->
      <polygon points="165,228 158,212 178,226" fill="#9B6BC8"/>
      <polygon points="167,226 162,216 176,224" fill="#D08AD8" opacity=".6"/>
      <!-- right ear -->
      <polygon points="225,228 232,212 212,226" fill="#9B6BC8"/>
      <polygon points="223,226 228,216 214,224" fill="#D08AD8" opacity=".6"/>

      <!-- eyes (white + pupil) -->
      <circle cx="180" cy="250" r="10" fill="white"/>
      <circle cx="210" cy="250" r="10" fill="white"/>
      <!-- pupils -->
      <circle cx="181" cy="251" r="6"  fill="#1C1040"/>
      <circle cx="211" cy="251" r="6"  fill="#1C1040"/>
      <!-- pupils highlight / star -->
      <circle cx="183" cy="249" r="2"  fill="white"/>
      <circle cx="213" cy="249" r="2"  fill="white"/>
      <!-- tiny star in eye -->
      <text x="181" y="255" text-anchor="middle" font-size="6" fill="white">✦</text>
      <text x="211" y="255" text-anchor="middle" font-size="6" fill="white">✦</text>

      <!-- nose -->
      <polygon points="195,257 192,261 198,261" fill="#1C1040"/>
      <!-- mouth -->
      <path d="M 191,262 Q 195,266 199,262" stroke="#1C1040" stroke-width="1.5" fill="none" stroke-linecap="round"/>

      <!-- blush cheeks -->
      <ellipse cx="165" cy="258" rx="10" ry="6"  fill="#F4A0B8" opacity=".7"/>
      <ellipse cx="225" cy="258" rx="10" ry="6"  fill="#F4A0B8" opacity=".7"/>

      <!-- body sparkle -->
      <text x="210" y="244" font-size="13" fill="#FFE87A">✦</text>

      <!-- paws -->
      <ellipse cx="170" cy="272" rx="14" ry="8" fill="#8A5CB8"/>
      <ellipse cx="220" cy="272" rx="14" ry="8" fill="#8A5CB8"/>
      <!-- paw lines -->
      <line x1="163" y1="272" x2="163" y2="278" stroke="#7A4CA8" stroke-width="1.2"/>
      <line x1="170" y1="272" x2="170" y2="278" stroke="#7A4CA8" stroke-width="1.2"/>
      <line x1="177" y1="272" x2="177" y2="278" stroke="#7A4CA8" stroke-width="1.2"/>
      <line x1="213" y1="272" x2="213" y2="278" stroke="#7A4CA8" stroke-width="1.2"/>
