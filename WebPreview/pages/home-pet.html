<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>METIME - Giardino</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:#e8dccf;
      min-height:100vh;display:flex;align-items:flex-start;justify-content:center;
    }
    .phone{
      width:390px;max-width:100vw;
      background:linear-gradient(160deg,#fdf3e3 0%,#f5ead8 100%);
      min-height:100vh;position:relative;overflow:hidden;
      display:flex;flex-direction:column;
    }

    /* ── Top selection bar ── */
    .top-bar{
      background:linear-gradient(to bottom,#fdf3e3,#f5ead8);
      border-bottom:1px solid #c9a96e;
      padding:52px 14px 10px;
      flex-shrink:0;
    }
    .top-row{display:flex;align-items:center;margin-bottom:10px;}
    .app-logo{
      display:flex;align-items:center;gap:6px;
      font-size:15px;font-weight:900;color:#3d2b1f;
    }
    .journey-btn{
      margin-left:auto;display:flex;align-items:center;gap:5px;
      background:linear-gradient(135deg,#d4a76a,#a67c52);
      color:#fff;border:none;border-radius:999px;
      padding:8px 14px;font-size:11px;font-weight:900;font-family:inherit;
      cursor:pointer;text-decoration:none;
    }
    .sections-scroll{
      display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;
      scrollbar-width:none;
    }
    .sections-scroll::-webkit-scrollbar{display:none;}
    .sec-btn{
      display:flex;align-items:center;gap:4px;
      padding:7px 11px;border-radius:20px;border:none;
      font-size:12px;font-weight:700;font-family:inherit;
      cursor:pointer;white-space:nowrap;
      background:rgba(201,169,110,0.18);color:#5e4636;
      text-decoration:none;transition:background .15s;
    }
    .sec-btn.active{background:#c9a96e;color:#fff;}
    .sec-btn-icon{font-size:14px;}

    /* ── Care panel ── */
    .care-panel{
      background:rgba(255,255,255,0.55);
      border-radius:20px;margin:10px 14px 0;padding:14px 16px;
      flex-shrink:0;backdrop-filter:blur(8px);
      border:1px solid rgba(201,169,110,0.3);
    }
    .care-headline{font-size:13px;font-weight:700;color:#3d2b1f;margin-bottom:10px;}
    .needs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .need-row{display:flex;align-items:center;gap:7px;}
    .need-icon{font-size:15px;flex-shrink:0;}
    .need-label{font-size:11px;font-weight:700;color:#5e4636;width:48px;flex-shrink:0;}
    .need-bar{flex:1;height:8px;background:rgba(0,0,0,0.1);border-radius:4px;overflow:hidden;}
    .need-fill{height:100%;border-radius:4px;transition:width .4s ease;}
    .need-fill.hunger{background:#F97316;}
    .need-fill.happy{background:#EC4899;}
    .need-fill.calm{background:#60A5FA;}
    .need-fill.energy{background:#34D399;}

    /* ── Scene ── */
    .scene{flex:1;position:relative;overflow:hidden;min-height:270px;}
    #garden{width:100%;display:block;}

    /* ── Speech bubble ── */
    #speech{
      position:absolute;top:10px;left:50%;transform:translateX(-50%);
      background:#fff;border-radius:14px;padding:6px 14px;
      font-size:13px;font-weight:700;color:#3d2b1f;white-space:nowrap;
      box-shadow:0 4px 12px rgba(61,43,31,.15);
      opacity:0;pointer-events:none;z-index:20;transition:opacity .2s;
    }
    #speech::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
      border-left:7px solid transparent;border-right:7px solid transparent;border-top:7px solid #fff;}
    #speech.show{animation:sbshow 2.2s ease-out forwards;}
    @keyframes sbshow{
      0%{opacity:0;transform:translateX(-50%) translateY(6px) scale(.7)}
      15%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
      75%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
      100%{opacity:0;transform:translateX(-50%) translateY(-10px) scale(.85)}
    }

    /* ── Particle ── */
    .ptc{position:absolute;font-size:16px;pointer-events:none;animation:ptrise 1.8s ease-out forwards;}
    @keyframes ptrise{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(.4) rotate(30deg)}}

    /* ── Action card ── */
    .acard{
      background:linear-gradient(to top,#fdf3e3,rgba(253,243,227,0.97));
      border-radius:28px 28px 0 0;
      padding:16px 16px 34px;
      box-shadow:0 -4px 20px rgba(61,43,31,.08);
      flex-shrink:0;
    }
    .acard-label{
      font-size:10px;font-weight:700;color:#9a7a5a;
      text-transform:uppercase;letter-spacing:.5px;
      text-align:center;margin-bottom:12px;
    }
    .abtn-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
    .abtn{
      display:flex;flex-direction:column;align-items:center;gap:5px;
      border:0;background:none;cursor:pointer;padding:3px 0;
    }
    .abtn-circle{
      width:52px;height:52px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:22px;transition:transform .15s;
      box-shadow:0 3px 10px rgba(0,0,0,.1);
    }
    .abtn:active .abtn-circle{transform:scale(.88);}
    .abtn-circle.nutri{background:#FDE68A;}
    .abtn-circle.play{background:#BBF7D0;}
    .abtn-circle.calma{background:#E9D5FF;}
    .abtn-circle.diary{background:#FED7AA;}
    .abtn-circle.metime{background:#BFDBFE;}
    .abtn-label{font-size:10px;font-weight:700;color:#5e4636;}
  </style>
</head>
<body>
<div class="phone" id="phone">
  <div id="speech"></div>

  <!-- Top bar -->
  <div class="top-bar">
    <div class="top-row">
      <div class="app-logo">💛 METIME</div>
      <a class="journey-btn" href="journal.html">📖 Journey</a>
    </div>
    <div class="sections-scroll">
      <a class="sec-btn" href="hub.html"><span class="sec-btn-icon">🏠</span> Casa</a>
      <a class="sec-btn active" href="home-pet.html"><span class="sec-btn-icon">🌿</span> Giardino</a>
      <a class="sec-btn" href="#"><span class="sec-btn-icon">🎮</span> Giochi</a>
      <a class="sec-btn" href="journal.html"><span class="sec-btn-icon">📖</span> Diario</a>
      <a class="sec-btn" href="shop.html"><span class="sec-btn-icon">🛍</span> Store</a>
      <a class="sec-btn" href="#"><span class="sec-btn-icon">🎒</span> Zaino</a>
      <a class="sec-btn" href="#"><span class="sec-btn-icon">🎨</span> Decora</a>
      <a class="sec-btn" href="#"><span class="sec-btn-icon">☕</span> Me Time</a>
      <a class="sec-btn" href="care-ritual.html"><span class="sec-btn-icon">✨</span> Rituale</a>
      <a class="sec-btn" href="#"><span class="sec-btn-icon">🗺️</span> Mappa</a>
      <a class="sec-btn" href="#"><span class="sec-btn-icon">🍽️</span> Ristorante</a>
      <a class="sec-btn" href="#"><span class="sec-btn-icon">🌾</span> Fattoria</a>
    </div>
  </div>

  <!-- Care panel -->
  <div class="care-panel">
    <div class="care-headline" id="careHeadline">Come stai oggi? Prenditi cura di te 🌿</div>
    <div class="needs-grid">
      <div class="need-row">
        <span class="need-icon">🍊</span>
        <span class="need-label">Fame</span>
        <div class="need-bar"><div class="need-fill hunger" id="barF" style="width:58%"></div></div>
      </div>
      <div class="need-row">
        <span class="need-icon">💗</span>
        <span class="need-label">Umore</span>
        <div class="need-bar"><div class="need-fill happy" id="barH" style="width:72%"></div></div>
      </div>
      <div class="need-row">
        <span class="need-icon">💙</span>
        <span class="need-label">Calma</span>
        <div class="need-bar"><div class="need-fill calm" id="barC" style="width:65%"></div></div>
      </div>
      <div class="need-row">
        <span class="need-icon">💚</span>
        <span class="need-label">Energia</span>
        <div class="need-bar"><div class="need-fill energy" id="barE" style="width:48%"></div></div>
      </div>
    </div>
  </div>

  <!-- Isometric garden scene -->
  <div class="scene" id="scene">
    <svg id="garden" viewBox="0 0 390 280" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="petGrad" cx="35%" cy="28%" r="65%">
          <stop offset="0%" stop-color="#FDE68A"/>
          <stop offset="100%" stop-color="#D97706"/>
        </radialGradient>
        <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(61,43,31,0.18)"/>
          <stop offset="100%" stop-color="rgba(61,43,31,0)"/>
        </radialGradient>
      </defs>
    </svg>
  </div>

  <!-- Action card -->
  <div class="acard">
    <div class="acard-label">Prenditi cura del tuo pet</div>
    <div class="abtn-row">
      <button class="abtn" data-action="feed">
        <div class="abtn-circle nutri">🥕</div>
        <span class="abtn-label">Nutri</span>
      </button>
      <button class="abtn" data-action="play">
        <div class="abtn-circle play">🎮</div>
        <span class="abtn-label">Gioca</span>
      </button>
      <button class="abtn" data-action="calm">
        <div class="abtn-circle calma">✨</div>
        <span class="abtn-label">Calma</span>
      </button>
      <button class="abtn" data-action="diary">
        <div class="abtn-circle diary">📖</div>
        <span class="abtn-label">Diario</span>
      </button>
      <button class="abtn" data-action="metime">
        <div class="abtn-circle metime">☕</div>
        <span class="abtn-label">Me Time</span>
      </button>
    </div>
  </div>
</div>

<script>
const svg = document.getElementById('garden');
const NS = 'http://www.w3.org/2000/svg';
const TW = 64, TH = 32;
const CX = 195, SY = 40;
const G  = 5;

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}
function iso(col, row) { return { x: CX + (col - row) * TW/2, y: SY + (col + row) * TH/2 }; }
function tilePts(col, row) {
  const {x,y} = iso(col,row), hw=TW/2, hh=TH/2;
  return `${x},${y} ${x+hw},${y+hh} ${x},${y+TH} ${x-hw},${y+hh}`;
}
function drawOrder() {
  const items=[];
  for(let c=0;c<G;c++) for(let r=0;r<G;r++) items.push([c,r]);
  return items.sort((a,b)=>(a[0]+a[1])-(b[0]+b[1])||a[0]-b[0]);
}

// Ground tiles — warm earth tones
const tileLayer = el('g',{id:'tiles'});
for (const [c,r] of drawOrder()) {
  tileLayer.appendChild(el('polygon',{
    points: tilePts(c,r),
    fill: (c+r)%2===0 ? '#D4C4A0' : '#C8B890',
    stroke:'#B8A070','stroke-width':'1','stroke-linejoin':'round'
  }));
}
svg.appendChild(tileLayer);

// Tree at (0,1)
{
  const {x:bx,y} = iso(0,1); const by = y+TH+4;
  const tg = el('g',{id:'tree'});
  tg.appendChild(el('rect',{x:bx-5,y:by-28,width:10,height:28,fill:'#8B6040',rx:'3'}));
  tg.appendChild(el('circle',{cx:bx-9,cy:by-46,r:'22',fill:'#3D9E3D'}));
  tg.appendChild(el('circle',{cx:bx+9,cy:by-44,r:'19',fill:'#4DB44D'}));
  tg.appendChild(el('circle',{cx:bx,  cy:by-56,r:'25',fill:'#5DBD5B'}));
  tg.appendChild(el('circle',{cx:bx-6,cy:by-62,r:'8', fill:'#7DD87D',opacity:'.45'}));
  svg.appendChild(tg);
}

// Bush at (4,2)
{
  const {x:bx,y} = iso(4,2); const by = y+TH;
  const bg = el('g',{id:'bush'});
  bg.appendChild(el('circle',{cx:bx-12+6,cy:by-18,r:'16',fill:'#38883A'}));
  bg.appendChild(el('circle',{cx:bx+10+6,cy:by-16,r:'14',fill:'#44A044'}));
  bg.appendChild(el('circle',{cx:bx+6,   cy:by-24,r:'18',fill:'#4CAF50'}));
  bg.appendChild(el('circle',{cx:bx+2,   cy:by-30,r:'6', fill:'#68CC6A',opacity:'.5'}));
  svg.appendChild(bg);
}

// Flowers
const flLayer = el('g',{id:'flowers'});
for (const {c,r,e} of [{c:0,r:3,e:'🌸'},{c:1,r:4,e:'🌼'},{c:3,r:0,e:'🌺'},{c:4,r:3,e:'🌷'},{c:2,r:4,e:'🌼'}]) {
  const {x,y} = iso(c,r);
  const ft = el('text',{x,y:y+TH/2+6,'font-size':'22','text-anchor':'middle','dominant-baseline':'middle'});
  ft.textContent = e;
  flLayer.appendChild(ft);
}
svg.appendChild(flLayer);

// Pet at (2,2) — warm golden tone
{
  const {x:px, y:py0} = iso(2,2); const py = py0+TH/2;
  const pg = el('g',{id:'petGroup',style:'cursor:pointer'});

  pg.appendChild(el('ellipse',{cx:px,cy:py+30,rx:'32',ry:'9',fill:'url(#shadowGrad)'}));
  pg.appendChild(el('ellipse',{cx:px,cy:py+2,rx:'36',ry:'34',
    fill:'url(#petGrad)',stroke:'#B45309','stroke-width':'2',id:'petBody'}));
  pg.appendChild(el('ellipse',{cx:px-18,cy:py+10,rx:'10',ry:'6',fill:'rgba(252,165,75,0.42)'}));
  pg.appendChild(el('ellipse',{cx:px+18,cy:py+10,rx:'10',ry:'6',fill:'rgba(252,165,75,0.42)'}));

  const eyeL = el('circle',{cx:px-11,cy:py-2,r:'6',fill:'#3d2b1f',id:'eyeL'});
  const eyeR = el('circle',{cx:px+11,cy:py-2,r:'6',fill:'#3d2b1f',id:'eyeR'});
  pg.appendChild(eyeL); pg.appendChild(eyeR);
  pg.appendChild(el('circle',{cx:px-9, cy:py-4,r:'2',fill:'rgba(255,255,255,.9)'}));
  pg.appendChild(el('circle',{cx:px+13,cy:py-4,r:'2',fill:'rgba(255,255,255,.9)'}));

  const smile = el('path',{
    d:`M ${px-9} ${py+12} Q ${px} ${py+19} ${px+9} ${py+12}`,
    fill:'none',stroke:'#92400E','stroke-width':'2.5','stroke-linecap':'round',id:'petSmile'
  });
  pg.appendChild(smile);
  svg.appendChild(pg);

  // float
  let fy=0, fd=1;
  (function loop(){ fy+=fd*0.12; if(fy>6)fd=-1; if(fy<0)fd=1;
    pg.setAttribute('transform',`translate(0,${-fy})`); requestAnimationFrame(loop); })();

  // blink
  setInterval(()=>{
    eyeL.setAttribute('r','2'); eyeR.setAttribute('r','2');
    setTimeout(()=>{ eyeL.setAttribute('r','6'); eyeR.setAttribute('r','6'); },160);
  }, 3800+Math.random()*1200);

  pg.addEventListener('click',()=>{
    state.happiness=clamp(state.happiness+3); state.calm=clamp(state.calm+1);
    spawnParticles(px,py-40);
    showSpeech(['Ciao! 👋','Gnam? 🍎','Sono felice ✨','Gioca con me! 🎉'][Math.floor(Math.random()*4)]);
    squishPet(); render();
  });
}

function squishPet(){
  const b=document.getElementById('petBody'); if(!b)return;
  b.setAttribute('rx','42'); b.setAttribute('ry','28');
  setTimeout(()=>{ b.setAttribute('rx','32'); b.setAttribute('ry','38'); },120);
  setTimeout(()=>{ b.setAttribute('rx','36'); b.setAttribute('ry','34'); },280);
}

// ── State ──
const state={hunger:58,happiness:72,calm:65,energy:48};
const clamp=v=>Math.max(0,Math.min(100,v));

function careHeadlineText(){
  if(state.hunger<25||state.energy<25) return 'Il tuo pet è affamato e stanco 😴';
  if(state.calm<30)                    return 'Il tuo pet ha bisogno di calma 😰';
  if((state.happiness+state.calm)/2>70)return 'Il tuo pet è felice e sereno 🥰';
  return 'Come stai oggi? Prenditi cura di te 🌿';
}

function render(){
  document.getElementById('barH').style.width=state.happiness+'%';
  document.getElementById('barF').style.width=state.hunger+'%';
  document.getElementById('barC').style.width=state.calm+'%';
  document.getElementById('barE').style.width=state.energy+'%';
  document.getElementById('careHeadline').textContent=careHeadlineText();

  const smile=document.getElementById('petSmile');
  if(smile){
    const {x:px,y:py0}=iso(2,2); const py=py0+TH/2;
    if(state.energy<25||state.hunger<25)
      smile.setAttribute('d',`M ${px-8} ${py+16} Q ${px} ${py+13} ${px+8} ${py+16}`);
    else if(state.calm<30)
      smile.setAttribute('d',`M ${px-7} ${py+15} Q ${px} ${py+10} ${px+7} ${py+15}`);
    else
      smile.setAttribute('d',`M ${px-9} ${py+12} Q ${px} ${py+19} ${px+9} ${py+12}`);
  }
}

setInterval(()=>{
  state.hunger=clamp(state.hunger-0.4);
  state.energy=clamp(state.energy-0.25);
  state.happiness=clamp(state.happiness-0.2);
  render();
},5000);

function showSpeech(text){
  const s=document.getElementById('speech');
  s.textContent=text; s.classList.remove('show'); void s.offsetWidth; s.classList.add('show');
}

function spawnParticles(x,y){
  const scene=document.getElementById('scene');
  const emojis=['✨','💛','🌸','⭐','💫'];
  for(let i=0;i<5;i++){
    const p=document.createElement('span'); p.className='ptc';
    p.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    const rect=scene.getBoundingClientRect();
    p.style.left=(x/390*rect.width+(Math.random()-.5)*40)+'px';
    p.style.top=(y/280*(rect.height-40)+(Math.random()-.5)*20)+'px';
    p.style.animationDelay=(i*.1)+'s';
    scene.appendChild(p); setTimeout(()=>p.remove(),2000);
  }
}

const actions={
  feed:   {h:+5, f:+18,c:-1, e:+3, msg:'Gnam gnam! 🍎'},
  play:   {h:+16,f:-4, c:-3, e:-8, msg:'Evviva!! 🎉'},
  calm:   {h:+7, f:-2, c:+18,e:+2, msg:'Ommm... 🍃'},
  diary:  {h:+3, f:0,  c:+5, e:0,  msg:'Scrivo nel diario 📖', link:'journal.html'},
  metime: {h:+8, f:-1, c:+12,e:+5, msg:'Momento per me ☕', link:'care-ritual.html'}
};

document.querySelectorAll('[data-action]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const a=actions[btn.dataset.action]; if(!a)return;
    state.happiness=clamp(state.happiness+a.h);
    state.hunger   =clamp(state.hunger   +a.f);
    state.calm     =clamp(state.calm     +a.c);
    state.energy   =clamp(state.energy   +a.e);
    showSpeech(a.msg); spawnParticles(195,120); squishPet(); render();
    if(a.link) setTimeout(()=>location.href=a.link,600);
  });
});

render();
</script>
</body>
</html>
