<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>METIME - La tua Casa</title>
  <link rel="stylesheet" href="../assets/kawaii.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(160deg, #FFB6C1 0%, #E8C4F0 50%, #C4B0F8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .phone-frame {
      width: 375px;
      min-height: 812px;
      background: linear-gradient(160deg, #F8EEFF 0%, #EED8FF 50%, #DEC8F8 100%);
      border-radius: 44px;
      box-shadow: 0 30px 80px rgba(100, 60, 180, 0.3), 0 0 0 1px rgba(255,255,255,0.4);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .house-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 12px;
    }
    .house-title {
      font-size: 22px;
      font-weight: 800;
      color: #2d1f4e;
    }
    .house-balance {
      font-size: 14px;
      font-weight: 800;
      color: #2d1f4e;
      background: rgba(255,255,255,0.7);
      padding: 8px 14px;
      border-radius: 999px;
      box-shadow: 0 2px 10px rgba(150,100,220,0.15);
    }

    /* Scrollable content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 24px;
      position: relative;
    }
    .content::-webkit-scrollbar { display: none; }

    /* Room area */
    .room-area {
      position: relative;
      margin-bottom: 20px;
    }

    /* Floating decorations around room */
    .room-floats {
      position: absolute;
      inset: -10px;
      pointer-events: none;
      z-index: 5;
    }
    .float-deco {
      position: absolute;
      font-size: 16px;
      opacity: 0.7;
      animation: deco-float 3s ease-in-out infinite alternate;
    }
    @keyframes deco-float {
      0% { transform: translateY(0) rotate(-5deg); }
      100% { transform: translateY(-10px) rotate(5deg); }
    }

    /* Isometric room — hexagon/cube style */
    .iso-room {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 0.85;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 16px 50px rgba(120,80,200,0.25), 0 0 0 2px rgba(255,255,255,0.5);
    }

    /* Back wall (top 55%) */
    .room-wall {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 55%;
      background: linear-gradient(180deg, #F2DCFF 0%, #E8D0FF 100%);
      background-image:
        repeating-linear-gradient(
          90deg,
          transparent 0px,
          transparent 30px,
          rgba(180,140,220,0.12) 30px,
          rgba(180,140,220,0.12) 31px
        );
    }
    /* Wall border line */
    .room-wall::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: rgba(160,110,220,0.35);
    }

    /* Floor (bottom 45%) */
    .room-floor {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 47%;
      background:
        repeating-conic-gradient(#EDE0FF 0% 25%, #E0CCFF 0% 50%) 0 0 / 32px 32px;
    }

    /* 3D perspective edge on the sides */
    .room-left-edge {
      position: absolute;
      top: 0; left: 0;
      width: 14px;
      height: 100%;
      background: linear-gradient(90deg, rgba(140,100,200,0.25), transparent);
      z-index: 2;
    }
    .room-right-edge {
      position: absolute;
      top: 0; right: 0;
      width: 14px;
      height: 100%;
      background: linear-gradient(270deg, rgba(140,100,200,0.25), transparent);
      z-index: 2;
    }

    /* Pet blob in room */
    .room-pet {
      position: absolute;
      bottom: 22%;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 32%, #fff 0%, #d8c4f0 55%, #b89ee0 100%);
      box-shadow: 0 8px 20px rgba(150,100,200,0.3);
      z-index: 3;
      animation: room-pet-float 2.8s ease-in-out infinite;
    }
    @keyframes room-pet-float {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-8px); }
    }
    .room-pet-shadow {
      position: absolute;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 12px;
      background: radial-gradient(ellipse, rgba(120,80,180,0.2) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 2;
    }
    .room-pet-eye {
      position: absolute;
      width: 8px; height: 8px;
      background: #2d1f4e;
      border-radius: 50%;
      top: 32px;
    }
    .room-pet-eye::after {
      content: '';
      position: absolute;
      width: 3px; height: 3px;
      background: rgba(255,255,255,0.9);
      border-radius: 50%;
      top: 1px; left: 1px;
    }
    .room-pet-eye-l { left: 20px; }
    .room-pet-eye-r { right: 20px; }
    .room-pet-cheek {
      position: absolute;
      width: 14px; height: 9px;
      border-radius: 50%;
      background: rgba(255,160,180,0.4);
      top: 44px;
    }
    .room-pet-cheek-l { left: 14px; }
    .room-pet-cheek-r { right: 14px; }
    .room-pet-smile {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px; height: 6px;
      border-bottom: 2px solid #7a5fad;
      border-radius: 0 0 8px 8px;
    }

    /* Room accessories */
    .room-plant {
      position: absolute;
      bottom: 10%;
      left: 10%;
      font-size: 42px;
      z-index: 3;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }
    .room-lamp {
      position: absolute;
      bottom: 10%;
      right: 10%;
      font-size: 38px;
      z-index: 3;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }
    .room-cushion {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 28px;
      z-index: 2;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,0.08));
    }
    .room-picture {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 32px;
      z-index: 3;
    }

    /* Action buttons */
    .action-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .action-pill {
      flex: 1;
      padding: 14px 8px;
      border: none;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .action-pill:hover { transform: translateY(-2px); }
    .action-pill:active { transform: scale(0.97); }
    .pill-store {
      background: linear-gradient(135deg, #FFB6C1, #FF8DA0);
      color: #7a2040;
      box-shadow: 0 6px 16px rgba(255,120,150,0.3);
    }
    .pill-bag {
      background: linear-gradient(135deg, #B0D8FF, #80BFFF);
      color: #1a4a7a;
      box-shadow: 0 6px 16px rgba(100,170,255,0.3);
    }
    .pill-decorate {
      background: linear-gradient(135deg, #D4BCFF, #B89AEE);
      color: #3a1a7a;
      box-shadow: 0 6px 16px rgba(160,120,240,0.3);
    }

    /* Comfort card */
    .comfort-card {
      background: rgba(255,255,255,0.7);
      border-radius: 20px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 12px rgba(150,100,220,0.1);
      margin-bottom: 12px;
    }
    .comfort-label { font-size: 14px; font-weight: 700; color: #2d1f4e; }
    .comfort-stars { font-size: 18px; letter-spacing: 2px; }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      pointer-events: none;
    }
    .toast {
      background: #fff;
      border-radius: 16px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 700;
      color: #4a3580;
      box-shadow: 0 6px 20px rgba(100,60,180,0.2);
      animation: toast-in 0.3s ease-out, toast-out 0.3s ease-in 2s forwards;
      white-space: nowrap;
    }
    @keyframes toast-in { from { opacity: 0; transform: translateY(-10px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes toast-out { from { opacity: 1; } to { opacity: 0; transform: translateY(-8px); } }

    /* Bottom tab bar */
    .tab-bar {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(200,180,240,0.3);
      border-radius: 0 0 44px 44px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 8px 18px;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-decoration: none;
      padding: 4px 12px;
      border-radius: 16px;
    }
    .tab-item.active { background: rgba(150,100,220,0.12); }
    .tab-icon { font-size: 22px; }
    .tab-label { font-size: 10px; font-weight: 700; color: #9b8bbf; }
    .tab-item.active .tab-label { color: #7a4fbf; }
  </style>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <div class="phone-frame">
    <!-- Header -->
    <div class="house-header">
      <div class="house-title">&#127968; La tua Casa</div>
      <div class="house-balance">&#129683; <span id="coinsDisplay">100</span> &#128142; <span id="gemsDisplay">5</span></div>
    </div>

    <div class="content">
      <!-- Room area -->
      <div class="room-area">
        <!-- Floating decorations -->
        <div class="room-floats">
          <span class="float-deco" style="top:5%;left:2%;animation-delay:0s">&#10024;</span>
          <span class="float-deco" style="top:10%;right:3%;animation-delay:0.6s">&#128149;</span>
          <span class="float-deco" style="bottom:15%;left:1%;animation-delay:1.1s">&#11088;</span>
          <span class="float-deco" style="bottom:20%;right:2%;animation-delay:0.3s">&#128142;</span>
          <span class="float-deco" style="top:35%;left:0%;animation-delay:1.5s">&#127800;</span>
          <span class="float-deco" style="top:40%;right:1%;animation-delay:0.8s">&#10024;</span>
        </div>

        <!-- Isometric room -->
        <div class="iso-room" id="isoRoom">
          <div class="room-wall"></div>
          <div class="room-floor"></div>
          <div class="room-left-edge"></div>
          <div class="room-right-edge"></div>

          <!-- Accessories -->
          <div class="room-picture" id="roomPicture">&#128444;&#65039;</div>
          <div class="room-plant" id="roomPlant">&#127812;</div>
          <div class="room-lamp" id="roomLamp">&#128294;</div>
          <div class="room-cushion" id="roomCushion">&#129764;</div>

          <!-- Pet shadow -->
          <div class="room-pet-shadow"></div>

          <!-- Pet blob -->
          <div class="room-pet" id="roomPet">
            <div class="room-pet-eye room-pet-eye-l"></div>
            <div class="room-pet-eye room-pet-eye-r"></div>
            <div class="room-pet-cheek room-pet-cheek-l"></div>
            <div class="room-pet-cheek room-pet-cheek-r"></div>
            <div class="room-pet-smile"></div>
          </div>
        </div>
      </div>

      <!-- Comfort -->
      <div class="comfort-card">
        <div class="comfort-label">&#127968; Comfort stanza</div>
        <div class="comfort-stars" id="comfortStars">&#11088;&#11088;&#11088;&#9734;&#9734;</div>
      </div>

      <!-- Action buttons -->
      <div class="action-row">
        <a class="action-pill pill-store" href="shop.html">&#128717;&#65039; Store</a>
        <button class="action-pill pill-bag" id="bagBtn">&#127954; Zaino</button>
        <button class="action-pill pill-decorate" id="decorateBtn">&#10024; Decora</button>
      </div>
    </div>

    <!-- Tab bar -->
    <nav class="tab-bar">
      <a class="tab-item" href="home-pet.html">
        <span class="tab-icon">&#127807;</span>
        <span class="tab-label">Giardino</span>
      </a>
      <a class="tab-item active" href="hub.html">
        <span class="tab-icon">&#127968;</span>
        <span class="tab-label">Casa</span>
      </a>
      <a class="tab-item" href="care-ritual.html">
        <span class="tab-icon">&#10024;</span>
        <span class="tab-label">Cura</span>
      </a>
      <a class="tab-item" href="journal.html">
        <span class="tab-icon">&#128214;</span>
        <span class="tab-label">Diario</span>
      </a>
    </nav>
  </div>

  <script>
    function load(k, fb) { try { return JSON.parse(localStorage.getItem(k)); } catch(e) {} return fb; }
    const coins = load('metime_shop_coins', 100);
    const gems  = load('metime_shop_gems',  5);

    document.getElementById('coinsDisplay').textContent = coins;
    document.getElementById('gemsDisplay').textContent = gems;

    const toastContainer = document.getElementById('toastContainer');

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      toastContainer.appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }

    // Pet blink
    const roomPet = document.getElementById('roomPet');
    setInterval(() => {
      const eyes = roomPet.querySelectorAll('.room-pet-eye');
      eyes.forEach(e => e.style.height = '2px');
      setTimeout(() => eyes.forEach(e => e.style.height = ''), 160);
    }, 4000 + Math.random() * 2000);

    // Pet click
    roomPet.addEventListener('click', () => {
      showToast('Mimi ti ama! 💜');
    });

    // Bag button
    document.getElementById('bagBtn').addEventListener('click', () => {
      showToast('🎒 Zaino: 4 oggetti disponibili');
    });

    // Decorate button
    document.getElementById('decorateBtn').addEventListener('click', () => {
      showToast('✨ Modalita decorazione in arrivo!');
    });
  </script>
</body>
</html>
