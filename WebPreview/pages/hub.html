<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>METIME - La tua Casa</title>
  <link rel="stylesheet" href="../assets/kawaii.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(180deg, #FFB8D0 0%, #E8C4F4 50%, #C4B4F0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .phone-frame {
      width: 390px;
      max-width: 430px;
      min-height: 844px;
      background: linear-gradient(180deg, #FFB8D0 0%, #E8C4F4 50%, #C4B4F0 100%);
      border-radius: 44px;
      box-shadow: 0 30px 80px rgba(100, 60, 180, 0.3), 0 0 0 1px rgba(255,255,255,0.4);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Background stars / hearts */
    .bg-deco {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .bg-deco span {
      position: absolute;
      animation: bg-float 4s ease-in-out infinite alternate;
    }
    @keyframes bg-float {
      0% { transform: translateY(0) rotate(-5deg); }
      100% { transform: translateY(-10px) rotate(5deg); }
    }

    /* ── HEADER ── */
    .house-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 14px;
      position: relative;
      z-index: 2;
    }
    .house-title {
      font-size: 22px;
      font-weight: 700;
      color: #5B3DA8;
    }
    .header-pills {
      display: flex;
      gap: 8px;
    }
    .pill-coin {
      background: #F5C842;
      color: #8B5E0A;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 700;
    }
    .pill-gem {
      background: #9B6FE8;
      color: #fff;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 700;
    }

    /* Scrollable content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 100px;
      position: relative;
      z-index: 1;
    }
    .content::-webkit-scrollbar { display: none; }

    /* ── ISOMETRIC ROOM ── */
    .room-container {
      position: relative;
      width: 340px;
      height: 300px;
      margin: 20px auto;
    }

    /* Floor — diamond shape at bottom */
    .room-floor {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 140px;
      clip-path: polygon(50% 0%, 100% 30%, 50% 60%, 0% 30%);
      background-color: #F5E8B0;
      background-image:
        linear-gradient(rgba(200,180,100,0.3) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,180,100,0.3) 1px, transparent 1px);
      background-size: 45px 45px;
    }

    /* Left wall */
    .room-wall-left {
      position: absolute;
      top: 0; left: 0;
      width: 50%;
      height: 200px;
      clip-path: polygon(0% 40%, 50% 10%, 50% 70%, 0% 100%);
      background-color: #F5C8B0;
      background-image: repeating-linear-gradient(
        0deg,
        transparent, transparent 28px,
        rgba(255,220,180,0.5) 28px, rgba(255,220,180,0.5) 56px
      );
    }

    /* Right wall */
    .room-wall-right {
      position: absolute;
      top: 0; right: 0;
      width: 50%;
      height: 200px;
      clip-path: polygon(50% 10%, 100% 40%, 100% 100%, 50% 70%);
      background-color: #D8C8F0;
      background-image: repeating-linear-gradient(
        0deg,
        transparent, transparent 28px,
        rgba(200,180,240,0.5) 28px, rgba(200,180,240,0.5) 56px
      );
    }

    /* Window on right wall */
    .room-window {
      position: absolute;
      right: 16%;
      top: 18%;
      width: 50px;
      height: 65px;
      background: #B8E8F8;
      border: 3px solid #C8A87A;
      border-radius: 25px 25px 0 0;
      box-shadow: inset 0 2px 8px rgba(100,200,240,0.4);
      z-index: 2;
    }
    .room-window::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0; right: 0;
      height: 2px;
      background: #C8A87A;
    }
    .room-window::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 0; bottom: 0;
      width: 2px;
      background: #C8A87A;
    }

    /* ── ROOM OBJECTS (absolute inside .room-container) ── */

    /* Plant */
    .room-plant {
      position: absolute;
      left: 10%;
      bottom: 26%;
      width: 44px;
      z-index: 4;
    }
    .plant-vase {
      width: 32px;
      height: 24px;
      background: #7ECBA8;
      border-radius: 4px 4px 8px 8px;
      margin: 0 auto;
      position: relative;
    }
    .plant-vase::before {
      content: '';
      position: absolute;
      top: -4px; left: -4px; right: -4px;
      height: 6px;
      background: #6BB896;
      border-radius: 4px;
    }
    .plant-leaves {
      position: relative;
      height: 44px;
      width: 44px;
      margin: 0 auto;
    }
    .plant-leaf {
      position: absolute;
      background: #4AB878;
      border-radius: 50%;
    }
    .plant-leaf-1 { width: 28px; height: 28px; bottom: 0; left: 2px; }
    .plant-leaf-2 { width: 24px; height: 24px; bottom: 4px; left: 14px; background: #5CC882; }
    .plant-leaf-3 { width: 20px; height: 20px; bottom: 8px; left: 8px; background: #72D898; }

    /* Lamp */
    .room-lamp {
      position: absolute;
      right: 10%;
      bottom: 28%;
      width: 40px;
      z-index: 4;
    }
    .lamp-base {
      width: 18px;
      height: 28px;
      background: #F8B8C8;
      border-radius: 4px;
      margin: 0 auto;
    }
    .lamp-shade {
      width: 36px;
      height: 22px;
      background: #FFF3D4;
      border-radius: 18px 18px 6px 6px;
      margin: 0 auto;
      border: 2px solid #E8D898;
      position: relative;
    }
    .lamp-glow {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 30px;
      background: radial-gradient(ellipse, rgba(255,230,100,0.35) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    /* Cushion / bed area */
    .room-cushion {
      position: absolute;
      left: 52%;
      bottom: 18%;
      transform: translateX(-50%);
      width: 64px;
      height: 24px;
      background: #FFF3E0;
      border-radius: 50%;
      border: 2px solid #E8D8B8;
      box-shadow: 0 3px 8px rgba(180,140,80,0.2);
      z-index: 3;
    }

    /* Pet blob in room */
    .room-pet {
      position: absolute;
      left: 43%;
      bottom: 30%;
      transform: translateX(-50%);
      width: 70px;
      height: 80px;
      z-index: 5;
      animation: room-pet-float 2.8s ease-in-out infinite;
    }
    @keyframes room-pet-float {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-6px); }
    }

    /* Pet body */
    .pet-body {
      width: 70px;
      height: 70px;
      background: #9B78D8;
      border-radius: 45% 45% 40% 40%;
      position: relative;
    }

    /* Ears */
    .pet-ear {
      position: absolute;
      top: -14px;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 20px solid #9B78D8;
    }
    .pet-ear-l { left: 10px; transform: rotate(-8deg); }
    .pet-ear-r { right: 10px; transform: rotate(8deg); }
    .pet-ear-inner {
      position: absolute;
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 13px solid #C4A0F0;
    }
    .pet-ear-inner-l { left: 14px; top: -11px; transform: rotate(-8deg); }
    .pet-ear-inner-r { right: 14px; top: -11px; transform: rotate(8deg); }

    /* Eyes */
    .pet-eye-s {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #1a1030;
      border-radius: 50%;
      top: 26px;
    }
    .pet-eye-s::after {
      content: '';
      position: absolute;
      width: 3px; height: 3px;
      background: rgba(255,255,255,0.9);
      border-radius: 50%;
      top: 1px; left: 1px;
    }
    .pet-eye-sl { left: 16px; }
    .pet-eye-sr { right: 16px; }

    /* Cheeks small */
    .pet-cheek-s {
      position: absolute;
      width: 12px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,140,170,0.45);
      top: 38px;
    }
    .pet-cheek-sl { left: 10px; }
    .pet-cheek-sr { right: 10px; }

    /* Smile small */
    .pet-smile-s {
      position: absolute;
      top: 46px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 7px;
      border-bottom: 2px solid #6B3FAD;
      border-radius: 0 0 10px 10px;
    }

    /* Pet shadow */
    .room-pet-shadow {
      position: absolute;
      left: 43%;
      bottom: calc(30% - 10px);
      transform: translateX(-50%);
      width: 52px;
      height: 10px;
      background: radial-gradient(ellipse, rgba(100,60,160,0.2) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 4;
    }

    /* ── ACTION BUTTONS ── */
    .actions-card {
      background: #fff;
      border-radius: 24px;
      padding: 16px;
      margin: 0 0 16px;
      box-shadow: 0 4px 20px rgba(150,100,200,0.12);
    }
    .action-row {
      display: flex;
      gap: 10px;
    }
    .action-pill {
      flex: 1;
      padding: 14px 8px;
      border: none;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .action-pill:hover { transform: translateY(-2px); }
    .action-pill:active { transform: scale(0.97); }

    .pill-store {
      background: #FFB8C8;
      color: #C84870;
      box-shadow: 0 4px 12px rgba(255,100,140,0.25);
    }
    .pill-bag {
      background: #88C8F0;
      color: #1060A8;
      box-shadow: 0 4px 12px rgba(80,170,240,0.25);
    }
    .pill-decorate {
      background: #B88EF0;
      color: #fff;
      box-shadow: 0 4px 12px rgba(160,100,240,0.3);
    }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      pointer-events: none;
    }
    .toast {
      background: #fff;
      border-radius: 16px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 700;
      color: #4a3580;
      box-shadow: 0 6px 20px rgba(100,60,180,0.2);
      animation: toast-in 0.3s ease-out, toast-out 0.3s ease-in 2s forwards;
      white-space: nowrap;
    }
    @keyframes toast-in { from { opacity: 0; transform: translateY(-10px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes toast-out { from { opacity: 1; } to { opacity: 0; transform: translateY(-8px); } }

    /* ── TAB BAR ── */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 390px;
      max-width: 430px;
      background: #fff;
      border-top: 1px solid rgba(200,180,240,0.3);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 8px 18px;
      z-index: 30;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-decoration: none;
      padding: 4px 16px;
      border-radius: 16px;
      border: none;
      background: none;
      font-family: inherit;
      cursor: pointer;
    }
    .tab-icon { font-size: 22px; }
    .tab-label {
      font-size: 11px;
      font-weight: 700;
      color: #9b8bbf;
    }
    .tab-item.active .tab-label { color: #7B4FCC; }
    .tab-item.active { background: rgba(150,100,220,0.1); }
  </style>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <div class="phone-frame">
    <!-- Background decorations -->
    <div class="bg-deco">
      <span style="font-size:14px;top:8%;left:5%;opacity:0.5;animation-delay:0s">⭐</span>
      <span style="font-size:12px;top:14%;right:8%;opacity:0.4;animation-delay:0.6s">💛</span>
      <span style="font-size:16px;top:32%;left:3%;opacity:0.45;animation-delay:1.1s">🤍</span>
      <span style="font-size:13px;top:28%;right:5%;opacity:0.5;animation-delay:0.3s">💜</span>
      <span style="font-size:11px;top:55%;left:4%;opacity:0.4;animation-delay:1.5s">⭐</span>
      <span style="font-size:15px;top:60%;right:3%;opacity:0.5;animation-delay:0.8s">💛</span>
      <span style="font-size:12px;top:78%;left:6%;opacity:0.45;animation-delay:0.4s">🤍</span>
      <span style="font-size:14px;top:82%;right:7%;opacity:0.4;animation-delay:1.3s">💜</span>
    </div>

    <!-- Header -->
    <div class="house-header">
      <div class="house-title">🏠 La tua Casa</div>
      <div class="header-pills">
        <div class="pill-coin">🪙 <span id="coinsDisplay">100</span></div>
        <div class="pill-gem">💎 <span id="gemsDisplay">5</span></div>
      </div>
    </div>

    <div class="content">

      <!-- Isometric room -->
      <div class="room-container" id="roomContainer">

        <!-- Walls and floor -->
        <div class="room-wall-left"></div>
        <div class="room-wall-right"></div>
        <div class="room-floor"></div>

        <!-- Window on right wall -->
        <div class="room-window"></div>

        <!-- Plant (left, bottom) -->
        <div class="room-plant">
          <div class="plant-leaves">
            <div class="plant-leaf plant-leaf-1"></div>
            <div class="plant-leaf plant-leaf-2"></div>
            <div class="plant-leaf plant-leaf-3"></div>
          </div>
          <div class="plant-vase"></div>
        </div>

        <!-- Lamp (right, bottom) -->
        <div class="room-lamp">
          <div class="lamp-shade">
            <div class="lamp-glow"></div>
          </div>
          <div class="lamp-base"></div>
        </div>

        <!-- Cushion / bed -->
        <div class="room-cushion"></div>

        <!-- Pet shadow -->
        <div class="room-pet-shadow"></div>

        <!-- Pet in room -->
        <div class="room-pet" id="roomPet">
          <div class="pet-body">
            <div class="pet-ear pet-ear-l">
              <div class="pet-ear-inner pet-ear-inner-l"></div>
            </div>
            <div class="pet-ear pet-ear-r">
              <div class="pet-ear-inner pet-ear-inner-r"></div>
            </div>
            <div class="pet-eye-s pet-eye-sl"></div>
            <div class="pet-eye-s pet-eye-sr"></div>
            <div class="pet-cheek-s pet-cheek-sl"></div>
            <div class="pet-cheek-s pet-cheek-sr"></div>
            <div class="pet-smile-s"></div>
          </div>
        </div>

      </div>

      <!-- Action buttons card -->
      <div class="actions-card">
        <div class="action-row">
          <a class="action-pill pill-store" href="shop.html">🛍️ Store</a>
          <button class="action-pill pill-bag" id="bagBtn">🎒 Zaino</button>
          <button class="action-pill pill-decorate" id="decorateBtn">✨ Decora</button>
        </div>
      </div>

    </div>

    <!-- Tab bar -->
    <nav class="tab-bar">
      <a class="tab-item" href="garden-plants.html">
        <span class="tab-icon">🌱</span>
        <span class="tab-label">Giardino</span>
      </a>
      <a class="tab-item active" href="hub.html">
        <span class="tab-icon">🏠</span>
        <span class="tab-label">Casa</span>
      </a>
    </nav>
  </div>

  <script>
    function load(k, fb) { try { return JSON.parse(localStorage.getItem(k)); } catch(e) {} return fb; }
    const coins = load('metime_shop_coins', 100);
    const gems  = load('metime_shop_gems', 5);
    document.getElementById('coinsDisplay').textContent = coins;
    document.getElementById('gemsDisplay').textContent  = gems;

    const toastContainer = document.getElementById('toastContainer');
    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      toastContainer.appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }

    // Pet blink
    const roomPet = document.getElementById('roomPet');
    setInterval(() => {
      const eyes = roomPet.querySelectorAll('.pet-eye-s');
      eyes.forEach(e => { e.style.height = '2px'; e.style.borderRadius = '4px'; });
      setTimeout(() => eyes.forEach(e => { e.style.height = ''; e.style.borderRadius = ''; }), 160);
    }, 4000 + Math.random() * 2000);

    // Pet click
    roomPet.addEventListener('click', () => {
      showToast('Mimi ti ama! 💜');
    });

    // Bag button
    document.getElementById('bagBtn').addEventListener('click', () => {
      showToast('🎒 Zaino: 4 oggetti disponibili');
    });

    // Decorate button
    document.getElementById('decorateBtn').addEventListener('click', () => {
      showToast('✨ Modalità decorazione in arrivo!');
    });
  </script>
</body>
</html>
