<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>METIME - Store</title>
  <link rel="stylesheet" href="../assets/kawaii.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(160deg, #EEE8FF 0%, #DDD0FF 50%, #C8B8F8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .phone-frame {
      width: 375px;
      min-height: 812px;
      background: linear-gradient(160deg, #F4EEFF 0%, #EAE0FF 50%, #DDD0FF 100%);
      border-radius: 44px;
      box-shadow: 0 30px 80px rgba(100, 60, 180, 0.3), 0 0 0 1px rgba(255,255,255,0.4);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .store-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 12px;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(8px);
    }
    .header-gem-link {
      font-size: 13px;
      font-weight: 700;
      color: #7a50d0;
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 12px;
      background: rgba(180,140,255,0.2);
    }
    .header-title {
      font-size: 18px;
      font-weight: 800;
      color: #2d1f4e;
    }
    .header-close {
      font-size: 13px;
      font-weight: 700;
      color: #7a50d0;
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 12px;
      background: rgba(180,140,255,0.2);
      cursor: pointer;
      border: none;
      font-family: inherit;
    }

    /* Balance bar */
    .balance-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 10px 20px;
      background: rgba(255,255,255,0.7);
      margin: 0 16px 12px;
      border-radius: 20px;
      box-shadow: 0 2px 10px rgba(150,100,220,0.1);
    }
    .balance-item {
      font-size: 15px;
      font-weight: 800;
      color: #2d1f4e;
    }
    .balance-sep {
      width: 1px;
      height: 18px;
      background: rgba(150,100,220,0.2);
    }

    /* Scrollable content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 24px;
    }
    .content::-webkit-scrollbar { display: none; }

    /* Category tabs */
    .cat-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 12px;
      -webkit-overflow-scrolling: touch;
    }
    .cat-tabs::-webkit-scrollbar { display: none; }
    .cat-tab {
      flex-shrink: 0;
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      background: rgba(255,255,255,0.5);
      color: #666;
    }
    .cat-tab.active {
      background: #fff;
      box-shadow: 0 4px 12px rgba(150,100,220,0.2);
      color: #2d1f4e;
    }

    /* Product grid */
    .product-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Product card */
    .product-card {
      background: #fff;
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(150,100,220,0.12);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .product-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
    }
    .badge-bonus {
      background: linear-gradient(135deg, #FF9F4A, #FFB86C);
      color: #fff;
    }
    .badge-rare {
      background: linear-gradient(135deg, #9B6FE0, #C49AF8);
      color: #fff;
    }
    .product-emoji {
      font-size: 52px;
      margin-bottom: 10px;
      margin-top: 4px;
      display: block;
    }
    .product-name {
      font-size: 15px;
      font-weight: 800;
      color: #2d1f4e;
      margin-bottom: 4px;
    }
    .product-desc {
      font-size: 11px;
      color: #9b8bbf;
      font-weight: 500;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 8px;
    }
    .product-price {
      font-size: 13px;
      font-weight: 800;
      color: #7a50d0;
    }
    .buy-btn {
      padding: 8px 14px;
      background: linear-gradient(135deg, #9B6FE0, #C49AF8);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 12px rgba(150,100,220,0.3);
    }
    .buy-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(150,100,220,0.4); }
    .buy-btn:active { transform: scale(0.96); }
    .buy-btn.bought {
      background: linear-gradient(135deg, #aaa, #ccc);
      box-shadow: none;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      pointer-events: none;
    }
    .toast {
      background: #fff;
      border-radius: 16px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 700;
      color: #4a3580;
      box-shadow: 0 6px 20px rgba(100,60,180,0.2);
      animation: toast-in 0.3s ease-out, toast-out 0.3s ease-in 2s forwards;
      white-space: nowrap;
    }
    @keyframes toast-in { from { opacity: 0; transform: translateY(-10px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes toast-out { from { opacity: 1; } to { opacity: 0; transform: translateY(-8px); } }

    /* Bottom tab bar */
    .tab-bar {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(200,180,240,0.3);
      border-radius: 0 0 44px 44px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 8px 18px;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-decoration: none;
      padding: 4px 12px;
      border-radius: 16px;
    }
    .tab-item.active { background: rgba(150,100,220,0.12); }
    .tab-icon { font-size: 22px; }
    .tab-label { font-size: 10px; font-weight: 700; color: #9b8bbf; }
    .tab-item.active .tab-label { color: #7a4fbf; }
  </style>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <div class="phone-frame">
    <!-- Header -->
    <div class="store-header">
      <a class="header-gem-link" href="hub.html">&#128142; Acquista Gemme</a>
      <div class="header-title">&#127873; Store</div>
      <button class="header-close" onclick="history.back()">Chiudi</button>
    </div>

    <!-- Balance -->
    <div class="balance-bar">
      <div class="balance-item">&#129683; <span id="coinsDisplay">100</span></div>
      <div class="balance-sep"></div>
      <div class="balance-item">&#128142; <span id="gemsDisplay">5</span></div>
    </div>

    <div class="content">
      <!-- Category tabs -->
      <div class="cat-tabs" id="catTabs">
        <button class="cat-tab active" data-cat="food">&#128308; Cibo</button>
        <button class="cat-tab" data-cat="essentials">&#128153; Essenziali</button>
        <button class="cat-tab" data-cat="deco">&#128154; Decorazioni</button>
        <button class="cat-tab" data-cat="special">&#11088; Speciali</button>
      </div>

      <!-- Product grid -->
      <div class="product-grid" id="productGrid"></div>
    </div>

    <!-- Tab bar -->
    <nav class="tab-bar">
      <a class="tab-item" href="home-pet.html">
        <span class="tab-icon">&#128062;</span>
        <span class="tab-label">Pet</span>
      </a>
      <a class="tab-item" href="hub.html">
        <span class="tab-icon">&#127968;</span>
        <span class="tab-label">Casa</span>
      </a>
      <a class="tab-item active" href="shop.html">
        <span class="tab-icon">&#128722;</span>
        <span class="tab-label">Store</span>
      </a>
      <a class="tab-item" href="journal.html">
        <span class="tab-icon">&#128214;</span>
        <span class="tab-label">Diario</span>
      </a>
    </nav>
  </div>

  <script>
    (function() {
      const catalog = {
        food: [
          { id: 'carrot',  emoji: '🥕', name: 'Carota',       desc: 'Nutriente e croccante',        price: 20,  coins: true,  bonus: '+20% Fame' },
          { id: 'cookie',  emoji: '🍪', name: 'Biscotto',     desc: 'Dolce sorpresa kawaii',         price: 30,  coins: true },
          { id: 'cake',    emoji: '🎂', name: 'Torta',        desc: 'Per le occasioni speciali',     price: 80,  coins: true,  rare: true },
          { id: 'tea',     emoji: '🍵', name: 'The Calmante', desc: 'Rilassa e calma il pet',        price: 45,  coins: true,  bonus: '+30% Calma' },
          { id: 'apple',   emoji: '🍎', name: 'Mela',         desc: 'Fresca e vitaminica',           price: 15,  coins: true },
          { id: 'salad',   emoji: '🥗', name: 'Insalata',     desc: 'Leggera e sana',                price: 25,  coins: true }
        ],
        essentials: [
          { id: 'brush',   emoji: '🪮', name: 'Spazzola',     desc: 'Per un pelo lucente',           price: 50,  coins: true },
          { id: 'bed',     emoji: '🛏️', name: 'Lettino',      desc: 'Sonni tranquilli garantiti',   price: 200, coins: true,  bonus: '+40% Energia' },
          { id: 'toy',     emoji: '🧸', name: 'Peluche',      desc: 'Compagno di giochi',            price: 60,  coins: true },
          { id: 'lamp',    emoji: '🪔', name: 'Lampada',      desc: 'Luce soffusa per la sera',      price: 80,  coins: true }
        ],
        deco: [
          { id: 'plant',   emoji: '🪴', name: 'Pianta',       desc: 'Porta verde e serenita',        price: 40,  coins: true },
          { id: 'flower',  emoji: '🌸', name: 'Fiori',        desc: 'Colori primaverili',            price: 35,  coins: true },
          { id: 'rainbow', emoji: '🌈', name: 'Arcobaleno',   desc: 'Sticker speciale da muro',      price: 3,   coins: false, gems: true },
          { id: 'stars',   emoji: '✨', name: 'Stelle',       desc: 'Decora il soffitto',            price: 2,   coins: false, gems: true }
        ],
        special: [
          { id: 'magic',   emoji: '🔮', name: 'Cristallo',    desc: 'Amplifica i poteri del pet',    price: 5,   coins: false, gems: true, rare: true },
          { id: 'crown',   emoji: '👑', name: 'Corona',       desc: 'Estetica VIP',                  price: 8,   coins: false, gems: true, rare: true },
          { id: 'wings',   emoji: '🦋', name: 'Ali',          desc: 'Il pet vola di felicita',       price: 10,  coins: false, gems: true },
          { id: 'halo',    emoji: '😇', name: 'Aureola',      desc: 'Effetto angelico kawaii',       price: 6,   coins: false, gems: true }
        ]
      };

      function load(k, fb) { try { return JSON.parse(localStorage.getItem(k)); } catch(e) {} return fb; }
      let coins = load('metime_shop_coins', 100);
      let gems  = load('metime_shop_gems',  5);
      let purchased = new Set(load('metime_shop_purchased', []));
      let currentCat = 'food';

      const toastContainer = document.getElementById('toastContainer');

      function saveAll() {
        localStorage.setItem('metime_shop_coins', JSON.stringify(coins));
        localStorage.setItem('metime_shop_gems', JSON.stringify(gems));
        localStorage.setItem('metime_shop_purchased', JSON.stringify([...purchased]));
      }

      function showToast(msg) {
        const t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        toastContainer.appendChild(t);
        setTimeout(() => t.remove(), 2500);
      }

      function updateBalance() {
        document.getElementById('coinsDisplay').textContent = coins;
        document.getElementById('gemsDisplay').textContent = gems;
      }

      function renderGrid() {
        const items = catalog[currentCat] || [];
        const grid = document.getElementById('productGrid');
        grid.innerHTML = items.map(item => {
          const isBought = purchased.has(item.id);
          const badgeHtml = item.rare
            ? '<span class="product-badge badge-rare">Raro</span>'
            : item.bonus
              ? '<span class="product-badge badge-bonus">' + item.bonus + '</span>'
              : '';
          const priceLabel = item.gems
            ? '&#128142; ' + item.price
            : '&#129683; ' + item.price;
          return '<div class="product-card">'
            + badgeHtml
            + '<span class="product-emoji">' + item.emoji + '</span>'
            + '<div class="product-name">' + item.name + '</div>'
            + '<div class="product-desc">' + item.desc + '</div>'
            + '<div class="product-footer">'
            + '<span class="product-price">' + priceLabel + '</span>'
            + '<button class="buy-btn' + (isBought ? ' bought' : '') + '" data-id="' + item.id + '">'
            + (isBought ? '&#10003; Usato' : 'Acquista &#128722;')
            + '</button>'
            + '</div>'
            + '</div>';
        }).join('');

        document.querySelectorAll('.buy-btn:not(.bought)').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.id;
            const item = items.find(it => it.id === id);
            if (!item) return;
            if (item.gems) {
              if (gems < item.price) { showToast('💎 Gemme insufficienti!'); return; }
              gems -= item.price;
            } else {
              if (coins < item.price) { showToast('🪙 Monete insufficienti!'); return; }
              coins -= item.price;
            }
            purchased.add(id);
            saveAll();
            updateBalance();
            showToast(item.emoji + ' ' + item.name + ' acquistato!');
            renderGrid();
          });
        });
      }

      document.querySelectorAll('.cat-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentCat = tab.dataset.cat;
          renderGrid();
        });
      });

      updateBalance();
      renderGrid();
    })();
  </script>
</body>
</html>
