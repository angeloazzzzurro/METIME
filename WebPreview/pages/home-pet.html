<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>METIME - Home Pet</title>
  <link rel="stylesheet" href="../assets/kawaii.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(160deg, #FFB6C1 0%, #E8C4F0 50%, #C4B0F8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .phone-frame {
      width: 375px;
      min-height: 812px;
      background: linear-gradient(160deg, #FFB6C1 0%, #E8C4F0 50%, #C4B0F8 100%);
      border-radius: 44px;
      box-shadow: 0 30px 80px rgba(100, 60, 160, 0.35), 0 0 0 1px rgba(255,255,255,0.3);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Floating background decorations */
    .bg-deco {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .bg-star {
      position: absolute;
      font-size: 14px;
      opacity: 0.5;
      animation: bg-float 4s ease-in-out infinite alternate;
    }
    @keyframes bg-float {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-12px) rotate(15deg); }
    }

    /* Scrollable content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 90px;
      position: relative;
      z-index: 1;
    }
    .content::-webkit-scrollbar { display: none; }

    /* Header card */
    .header-card {
      background: #fff;
      border-radius: 24px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(150, 100, 200, 0.15);
      margin-bottom: 16px;
    }
    .header-title { font-size: 28px; font-weight: 800; color: #2d1f4e; }
    .header-sub { font-size: 13px; color: #9b8bbf; margin-top: 2px; font-weight: 600; }
    .header-icon { font-size: 32px; }

    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-pill {
      background: #fff;
      border-radius: 20px;
      padding: 12px 14px;
      box-shadow: 0 2px 12px rgba(150, 100, 200, 0.1);
    }
    .stat-pill-label {
      font-size: 12px;
      font-weight: 700;
      color: #666;
      margin-bottom: 6px;
    }
    .stat-bar-wrap {
      height: 8px;
      border-radius: 999px;
      background: #f0edf8;
      overflow: hidden;
    }
    .stat-bar {
      height: 100%;
      border-radius: 999px;
      transition: width 0.4s ease;
    }
    .bar-pink   { background: linear-gradient(90deg, #ff8db0, #ffb3cc); }
    .bar-green  { background: linear-gradient(90deg, #60d394, #a5f0c5); }
    .bar-purple { background: linear-gradient(90deg, #9b8bbf, #c4b0f8); }
    .bar-orange { background: linear-gradient(90deg, #ff9f5a, #ffcc88); }
    .stat-val { font-size: 11px; font-weight: 800; color: #888; float: right; margin-bottom: 4px; }

    /* Pet scene */
    .pet-scene {
      position: relative;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      overflow: hidden;
    }

    /* Pet blob */
    .pet-blob {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 32%, #fff 0%, #e0d4f8 55%, #c4b0f8 100%);
      box-shadow: 0 12px 40px rgba(150, 100, 200, 0.3);
      position: relative;
      cursor: pointer;
      animation: pet-float 2.8s ease-in-out infinite;
      user-select: none;
      z-index: 2;
    }
    @keyframes pet-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    .pet-blob.squish { animation: pet-squish 0.4s ease; }
    @keyframes pet-squish {
      0%   { transform: scale(1, 1); }
      30%  { transform: scale(1.14, 0.88); }
      60%  { transform: scale(0.92, 1.1); }
      100% { transform: scale(1, 1); }
    }

    /* Pet eyes */
    .pet-eyes {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 24px;
    }
    .pet-eye {
      width: 16px;
      height: 16px;
      background: #2d1f4e;
      border-radius: 50%;
      position: relative;
    }
    .pet-eye::after {
      content: '';
      position: absolute;
      width: 5px; height: 5px;
      background: rgba(255,255,255,0.9);
      border-radius: 50%;
      top: 2px; left: 2px;
    }
    .pet-blob.blink .pet-eye {
      height: 3px;
      border-radius: 8px;
    }
    .pet-blob.blink .pet-eye::after { opacity: 0; }

    /* Cheeks */
    .pet-cheek {
      position: absolute;
      width: 28px; height: 18px;
      border-radius: 50%;
      background: rgba(255, 160, 180, 0.45);
      top: 94px;
    }
    .pet-cheek-l { left: 26px; }
    .pet-cheek-r { right: 26px; }

    /* Smile */
    .pet-smile {
      position: absolute;
      top: 104px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px; height: 12px;
      border-bottom: 3px solid #7a5fad;
      border-radius: 0 0 16px 16px;
    }

    /* Speech bubble */
    .speech-bubble {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      border-radius: 16px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 700;
      color: #4a3580;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(100, 60, 180, 0.15);
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -7px; left: 50%;
      transform: translateX(-50%);
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 7px solid #fff;
    }
    .speech-bubble.show {
      animation: bubble-show 2.2s ease-out forwards;
    }
    @keyframes bubble-show {
      0%   { opacity: 0; transform: translateX(-50%) translateY(6px) scale(0.7); }
      15%  { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
      75%  { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-10px) scale(0.85); }
    }

    /* Ground hill */
    .ground-hill {
      position: absolute;
      bottom: -20px; left: -15%; right: -15%;
      height: 80px;
      background: radial-gradient(ellipse at 50% 100%, #a8e6a3 0%, #7acc76 60%, #5bb857 100%);
      border-radius: 50%;
      z-index: 1;
    }

    /* Flowers */
    .flower {
      position: absolute;
      font-size: 18px;
      z-index: 2;
      animation: flower-sway 3s ease-in-out infinite alternate;
    }
    @keyframes flower-sway {
      0% { transform: rotate(-4deg); }
      100% { transform: rotate(4deg); }
    }

    /* Particles */
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      font-size: 16px;
      animation: p-rise 1.8s ease-out forwards;
      opacity: 0;
    }
    @keyframes p-rise {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-70px) scale(0.4) rotate(30deg); }
    }

    /* Action card */
    .action-card {
      background: #fff;
      border-radius: 28px;
      padding: 18px 16px;
      box-shadow: 0 4px 20px rgba(150, 100, 200, 0.15);
      margin-bottom: 16px;
    }
    .action-card-title {
      font-size: 13px;
      font-weight: 700;
      color: #9b8bbf;
      text-align: center;
      margin-bottom: 14px;
    }
    .action-btns {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .action-btn {
      border: none;
      border-radius: 20px;
      padding: 14px 6px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      font-weight: 800;
      font-size: 10px;
      font-family: inherit;
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
      overflow: hidden;
    }
    .action-btn:hover { transform: translateY(-2px); }
    .action-btn:active { transform: translateY(1px); }
    .action-btn .btn-ico { font-size: 22px; }
    .action-btn .btn-lbl { font-size: 11px; font-weight: 800; }

    .btn-meditate {
      background: linear-gradient(160deg, #e8d8ff, #d4bcff);
      color: #5a3a9a;
      box-shadow: 0 6px 16px rgba(140, 100, 220, 0.25);
    }
    .btn-food {
      background: linear-gradient(160deg, #ffe0d8, #ffbcb0);
      color: #a83a2a;
      box-shadow: 0 6px 16px rgba(220, 100, 80, 0.2);
    }
    .btn-play {
      background: linear-gradient(160deg, #d0eeff, #b0d8ff);
      color: #2a5a9a;
      box-shadow: 0 6px 16px rgba(80, 140, 220, 0.2);
    }
    .btn-journal {
      background: linear-gradient(160deg, #ffe8d0, #ffd4a8);
      color: #8a4a10;
      box-shadow: 0 6px 16px rgba(200, 130, 50, 0.2);
    }
    .action-btn.cooldown { pointer-events: none; filter: grayscale(0.4) brightness(0.9); }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 20px; right: 16px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: #fff;
      border-radius: 16px;
      padding: 10px 16px;
      box-shadow: 0 6px 20px rgba(100, 60, 180, 0.2);
      font-size: 13px;
      font-weight: 700;
      color: #4a3580;
      animation: toast-in 0.3s ease-out, toast-out 0.3s ease-in 2.2s forwards;
      display: flex; align-items: center; gap: 8px;
    }
    @keyframes toast-in { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes toast-out { from { opacity: 1; } to { opacity: 0; transform: translateY(-8px); } }

    /* Bottom tab bar */
    .tab-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(200, 180, 240, 0.3);
      border-radius: 0 0 44px 44px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 8px 18px;
      z-index: 10;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-decoration: none;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 16px;
      transition: background 0.2s;
      border: none;
      background: none;
      font-family: inherit;
    }
    .tab-item.active { background: rgba(150, 100, 220, 0.12); }
    .tab-icon { font-size: 22px; }
    .tab-label {
      font-size: 10px;
      font-weight: 700;
      color: #9b8bbf;
    }
    .tab-item.active .tab-label { color: #7a4fbf; }
  </style>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <div class="phone-frame">
    <!-- Background decorations -->
    <div class="bg-deco" id="bgDeco">
      <span class="bg-star" style="top:8%;left:8%;animation-delay:0s">✨</span>
      <span class="bg-star" style="top:12%;right:12%;animation-delay:0.5s">💫</span>
      <span class="bg-star" style="top:30%;left:5%;animation-delay:1s">⭐</span>
      <span class="bg-star" style="top:20%;right:6%;animation-delay:1.5s">✨</span>
      <span class="bg-star" style="top:55%;left:7%;animation-delay:0.7s">💕</span>
      <span class="bg-star" style="top:48%;right:5%;animation-delay:1.2s">✨</span>
    </div>

    <div class="content">
      <!-- Header card -->
      <div class="header-card">
        <div>
          <div class="header-title">MeTime</div>
          <div class="header-sub" id="moodSub">Mood: calm</div>
        </div>
        <span class="header-icon">🌸</span>
      </div>

      <!-- Stats grid -->
      <div class="stats-grid">
        <div class="stat-pill">
          <div><span class="stat-val" id="happinessTxt">72</span></div>
          <div class="stat-pill-label">💗 Felicità</div>
          <div class="stat-bar-wrap"><div class="stat-bar bar-pink" id="happinessBar" style="width:72%"></div></div>
        </div>
        <div class="stat-pill">
          <div><span class="stat-val" id="hungerTxt">65</span></div>
          <div class="stat-pill-label">🍀 Fame</div>
          <div class="stat-bar-wrap"><div class="stat-bar bar-green" id="hungerBar" style="width:65%"></div></div>
        </div>
        <div class="stat-pill">
          <div><span class="stat-val" id="calmTxt">80</span></div>
          <div class="stat-pill-label">🌙 Calma</div>
          <div class="stat-bar-wrap"><div class="stat-bar bar-purple" id="calmBar" style="width:80%"></div></div>
        </div>
        <div class="stat-pill">
          <div><span class="stat-val" id="energyTxt">58</span></div>
          <div class="stat-pill-label">⚡ Energia</div>
          <div class="stat-bar-wrap"><div class="stat-bar bar-orange" id="energyBar" style="width:58%"></div></div>
        </div>
      </div>

      <!-- Pet scene -->
      <div class="pet-scene" id="petScene">
        <div class="particles" id="particles"></div>

        <!-- Pet blob -->
        <div class="pet-blob" id="petBlob">
          <div class="speech-bubble" id="speechBubble">Ciao! 💜</div>
          <div class="pet-eyes">
            <div class="pet-eye"></div>
            <div class="pet-eye"></div>
          </div>
          <div class="pet-cheek pet-cheek-l"></div>
          <div class="pet-cheek pet-cheek-r"></div>
          <div class="pet-smile"></div>
        </div>

        <!-- Ground and flowers -->
        <div class="ground-hill"></div>
        <span class="flower" style="bottom:28px;left:22%">🌸</span>
        <span class="flower" style="bottom:24px;left:38%;animation-delay:0.4s">🌷</span>
        <span class="flower" style="bottom:28px;right:22%;animation-delay:0.8s">🌼</span>
        <span class="flower" style="bottom:22px;right:12%;animation-delay:1.2s">🌸</span>
        <span class="flower" style="bottom:30px;left:10%;animation-delay:0.6s">🌷</span>
      </div>

      <!-- Action card -->
      <div class="action-card">
        <div class="action-card-title">Cosa fai con il tuo pet?</div>
        <div class="action-btns">
          <button class="action-btn btn-meditate" data-action="meditate">
            <span class="btn-ico">🔮</span>
            <span class="btn-lbl">Medita</span>
          </button>
          <button class="action-btn btn-food" data-action="feed">
            <span class="btn-ico">🥕</span>
            <span class="btn-lbl">Cibo</span>
          </button>
          <button class="action-btn btn-play" data-action="play">
            <span class="btn-ico">🎮</span>
            <span class="btn-lbl">Gioca</span>
          </button>
          <a class="action-btn btn-journal" href="journal.html" style="text-decoration:none">
            <span class="btn-ico">📖</span>
            <span class="btn-lbl">Diario</span>
          </a>
        </div>
      </div>
    </div>

    <!-- Tab bar -->
    <nav class="tab-bar">
      <a class="tab-item active" href="home-pet.html">
        <span class="tab-icon">🐾</span>
        <span class="tab-label">Pet</span>
      </a>
      <a class="tab-item" href="hub.html">
        <span class="tab-icon">🏠</span>
        <span class="tab-label">Casa</span>
      </a>
      <a class="tab-item" href="care-ritual.html">
        <span class="tab-icon">✨</span>
        <span class="tab-label">Cura</span>
      </a>
      <a class="tab-item" href="journal.html">
        <span class="tab-icon">📖</span>
        <span class="tab-label">Diario</span>
      </a>
    </nav>
  </div>

  <script>
    const state = {
      hunger: 65, happiness: 72, calm: 80, energy: 58,
      mood: 'calm', petClicks: 0, idleTime: 0
    };
    const clamp = v => Math.max(0, Math.min(100, v));

    const petBlob = document.getElementById('petBlob');
    const speechBubble = document.getElementById('speechBubble');
    const particlesEl = document.getElementById('particles');
    const toastContainer = document.getElementById('toastContainer');
    const moodSub = document.getElementById('moodSub');

    const moodPhrases = {
      calm:    ['Che bella giornata! 🌸', 'Sto bene! 🍀', 'Mmm... fame? 🥕', 'Coccole! 🥰'],
      happy:   ['Sono felicissima! 💕', 'Yay~! ✨', 'Adoro questo posto! 🌈', 'Giochiamo! 🎉'],
      tired:   ['Zzz... 😴', 'Ho bisogno di riposare...', 'Ho fame... 😫'],
      anxious: ['Mi sento strana... 😰', 'Tutto ok? 💙', 'Aiutami!']
    };

    const actionParticles = {
      meditate: ['🔮','✨','💜','🌙'],
      feed:     ['🥕','🍎','🌿','💚'],
      play:     ['🎮','⭐','🎉','💫']
    };

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      toastContainer.appendChild(t);
      setTimeout(() => t.remove(), 2600);
    }

    function showSpeech(text) {
      speechBubble.textContent = text;
      speechBubble.classList.remove('show');
      void speechBubble.offsetWidth;
      speechBubble.classList.add('show');
    }

    function spawnParticles(type) {
      const emojis = actionParticles[type] || ['✨'];
      const rect = petBlob.getBoundingClientRect();
      const pRect = particlesEl.getBoundingClientRect();
      for (let i = 0; i < 6; i++) {
        const p = document.createElement('span');
        p.className = 'particle';
        p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        p.style.left = (rect.left - pRect.left + rect.width / 2 + (Math.random() - 0.5) * 60) + 'px';
        p.style.top  = (rect.top  - pRect.top  + rect.height / 3 + (Math.random() - 0.5) * 30) + 'px';
        p.style.animationDelay = (i * 0.07) + 's';
        particlesEl.appendChild(p);
        setTimeout(() => p.remove(), 2000);
      }
    }

    function updateMood() {
      const avg = (state.hunger + state.happiness + state.calm + state.energy) / 4;
      if (state.energy < 25 || state.hunger < 25) state.mood = 'tired';
      else if (state.calm < 30) state.mood = 'anxious';
      else if (avg > 72) state.mood = 'happy';
      else state.mood = 'calm';
    }

    function render() {
      updateMood();
      const moodLabels = { calm: 'Mood: calm', happy: 'Mood: felice 🥰', tired: 'Mood: stanco 😴', anxious: 'Mood: ansioso 😰' };
      moodSub.textContent = moodLabels[state.mood] || 'Mood: calm';

      document.getElementById('happinessTxt').textContent = Math.round(state.happiness);
      document.getElementById('hungerTxt').textContent    = Math.round(state.hunger);
      document.getElementById('calmTxt').textContent      = Math.round(state.calm);
      document.getElementById('energyTxt').textContent    = Math.round(state.energy);

      document.getElementById('happinessBar').style.width = state.happiness + '%';
      document.getElementById('hungerBar').style.width    = state.hunger + '%';
      document.getElementById('calmBar').style.width      = state.calm + '%';
      document.getElementById('energyBar').style.width    = state.energy + '%';
    }

    // Pet click
    petBlob.addEventListener('click', () => {
      state.petClicks++;
      state.happiness = clamp(state.happiness + 2);
      state.calm = clamp(state.calm + 1);
      state.idleTime = 0;

      petBlob.classList.remove('squish');
      void petBlob.offsetWidth;
      petBlob.classList.add('squish');

      const phrases = moodPhrases[state.mood] || moodPhrases.calm;
      showSpeech(phrases[Math.floor(Math.random() * phrases.length)]);
      spawnParticles('play');
      render();

      if (state.petClicks % 5 === 0) {
        showToast(`💖 Mimi ti adora! (${state.petClicks} coccole)`);
      }
    });

    // Blink
    setInterval(() => {
      petBlob.classList.add('blink');
      setTimeout(() => petBlob.classList.remove('blink'), 180);
    }, 3500 + Math.random() * 2000);

    // Actions
    document.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', e => {
        const action = btn.dataset.action;
        state.idleTime = 0;

        if (action === 'feed') {
          state.hunger = clamp(state.hunger + 18);
          state.happiness = clamp(state.happiness + 5);
          state.energy = clamp(state.energy + 3);
          showToast('🥕 Mimi ha mangiato!');
          showSpeech('Gnam gnam! 🥕');
        } else if (action === 'play') {
          state.happiness = clamp(state.happiness + 16);
          state.energy = clamp(state.energy - 8);
          state.calm = clamp(state.calm - 3);
          showToast('🎮 Giocato con Mimi!');
          showSpeech('Evviva!! 🎉');
        } else if (action === 'meditate') {
          state.calm = clamp(state.calm + 18);
          state.happiness = clamp(state.happiness + 7);
          state.energy = clamp(state.energy + 2);
          showToast('🔮 Meditazione fatta!');
          showSpeech('Ommm... 🔮');
        }

        spawnParticles(action);
        petBlob.classList.remove('squish');
        void petBlob.offsetWidth;
        petBlob.classList.add('squish');

        btn.classList.add('cooldown');
        setTimeout(() => btn.classList.remove('cooldown'), 1200);
        render();
      });
    });

    // Stat decay
    setInterval(() => {
      state.idleTime++;
      state.hunger = clamp(state.hunger - 0.3);
      state.energy = clamp(state.energy - 0.2);
      state.happiness = clamp(state.happiness - 0.15);
      if (state.idleTime > 8) {
        const p = ['Ehi, ci sei? 🥺', 'Gioca con me!', 'Mi annoio...', 'Vieni qui! 👋'];
        showSpeech(p[Math.floor(Math.random() * p.length)]);
        state.idleTime = 0;
      }
      render();
    }, 5000);

    render();
  </script>
</body>
</html>
