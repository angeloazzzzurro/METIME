<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>METIME - Store</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:#c8b8a8;min-height:100vh;
      display:flex;align-items:flex-start;justify-content:center;
    }
    .phone{
      width:390px;max-width:100vw;min-height:100vh;
      background:#fdf3e3;overflow:hidden;display:flex;flex-direction:column;
    }

    /* ── compactSelectionBar ── */
    .top-bar{
      background:linear-gradient(to bottom,#fdf3e3,#f5ead8);
      border-bottom:1px solid #c9a96e;
      padding:52px 14px 10px;flex-shrink:0;
    }
    .top-row{display:flex;align-items:center;margin-bottom:10px;}
    .app-logo{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:900;color:#3d2b1f;}
    .journey-btn{
      margin-left:auto;display:flex;align-items:center;gap:5px;
      background:linear-gradient(135deg,#d4a76a,#a67c52);
      color:#fff;border:none;border-radius:999px;
      padding:9px 14px;font-size:11px;font-weight:900;font-family:inherit;
      cursor:pointer;text-decoration:none;
    }
    .sections-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
    .sections-scroll::-webkit-scrollbar{display:none;}
    .sec-btn{
      --t:#5e4636;
      display:flex;align-items:center;gap:5px;
      padding:10px 12px;border-radius:999px;
      font-size:12px;font-weight:900;font-family:inherit;
      cursor:pointer;white-space:nowrap;
      background:rgba(253,243,227,0.94);color:var(--t);
      border:1.5px solid color-mix(in srgb,var(--t) 14%,transparent);
      text-decoration:none;transition:all .15s;flex-shrink:0;
    }
    .sec-btn.active{
      background:linear-gradient(135deg,var(--t),color-mix(in srgb,var(--t) 78%,#000));
      color:#fff;border-color:rgba(255,255,255,.18);
    }
    .si{font-size:13px;}

    /* ── careFocusPanel ── */
    .care-panel{
      background:linear-gradient(to bottom,#fdf3e3,#f5ead8);
      border-bottom:1px solid #c9a96e;
      padding:12px 14px 14px;flex-shrink:0;
    }
    .care-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;}
    .care-title-col{flex:1;min-width:0;}
    .care-title{font-size:18px;font-weight:900;color:#3d2b1f;margin-bottom:3px;letter-spacing:-.2px;}
    .care-sub{font-size:11px;font-weight:700;color:#5e4636;line-height:1.4;}
    .care-badges{display:flex;gap:6px;flex-shrink:0;}
    .cbadge{
      display:flex;align-items:center;gap:5px;
      padding:7px 10px;border-radius:999px;
      background:rgba(253,243,227,0.92);
      font-size:11px;font-weight:900;
    }
    .needs-row{display:flex;gap:8px;margin-bottom:12px;}
    .nbar{flex:1;display:flex;flex-direction:column;gap:4px;}
    .nbar-lbl{display:flex;align-items:center;gap:3px;font-size:9px;font-weight:700;}
    .nbar-track{height:6px;border-radius:999px;overflow:hidden;}
    .nbar-fill{height:100%;border-radius:999px;}
    .acts-scroll{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;}
    .acts-scroll::-webkit-scrollbar{display:none;}
    .abt{
      display:flex;flex-direction:column;align-items:center;gap:5px;
      width:70px;flex-shrink:0;border:0;background:none;cursor:pointer;padding:2px 0;
    }
    .abt:active .acircle{transform:scale(.88);}
    .acircle{
      width:36px;height:36px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;font-size:17px;
      transition:transform .15s;
    }
    .albl{font-size:10px;font-weight:900;line-height:1;}

    /* ── Balance bar ── */
    .balance-bar{
      display:flex;align-items:center;justify-content:center;gap:16px;
      padding:10px 20px;
      background:rgba(255,255,255,.6);
      margin:12px 16px 0;border-radius:18px;
      box-shadow:0 2px 8px rgba(61,43,31,.07);flex-shrink:0;
    }
    .balance-item{font-size:14px;font-weight:800;color:#3d2b1f;}
    .balance-sep{width:1px;height:16px;background:rgba(61,43,31,.15);}

    /* ── Store content ── */
    .store-content{flex:1;overflow-y:auto;padding:12px 16px 32px;}
    .store-content::-webkit-scrollbar{display:none;}

    /* Category tabs */
    .cat-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none;}
    .cat-tabs::-webkit-scrollbar{display:none;}
    .cat-tab{
      flex-shrink:0;padding:8px 16px;border-radius:999px;border:none;
      font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;
      transition:all .2s;background:rgba(255,255,255,.5);color:#5e4636;
    }
    .cat-tab.active{background:#fff;box-shadow:0 3px 10px rgba(61,43,31,.1);color:#3d2b1f;}

    /* Product grid */
    .product-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .product-card{
      background:#fff;border-radius:20px;padding:16px;
      box-shadow:0 3px 14px rgba(61,43,31,.09);
      position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;
    }
    .product-badge{
      position:absolute;top:10px;right:10px;
      padding:3px 9px;border-radius:999px;font-size:10px;font-weight:800;
    }
    .badge-bonus{background:linear-gradient(135deg,#FF9F4A,#FFB86C);color:#fff;}
    .badge-rare{background:linear-gradient(135deg,#d4a76a,#a67c52);color:#fff;}
    .product-emoji{font-size:48px;margin-bottom:8px;margin-top:4px;display:block;}
    .product-name{font-size:14px;font-weight:800;color:#3d2b1f;margin-bottom:3px;}
    .product-desc{font-size:11px;color:#9a7a5a;font-weight:500;margin-bottom:10px;line-height:1.4;}
    .product-footer{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px;}
    .product-price{font-size:12px;font-weight:800;color:#a67c52;}
    .buy-btn{
      padding:7px 13px;
      background:linear-gradient(135deg,#d4a76a,#a67c52);
      color:#fff;border:none;border-radius:999px;
      font-size:11px;font-weight:800;font-family:inherit;cursor:pointer;
      box-shadow:0 3px 10px rgba(164,120,70,.3);transition:transform .15s;
    }
    .buy-btn:hover{transform:translateY(-1px);}
    .buy-btn:active{transform:scale(.96);}
    .buy-btn.bought{background:linear-gradient(135deg,#aaa,#ccc);box-shadow:none;}

    /* Toast */
    .toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:100;pointer-events:none;}
    .toast{
      background:#fff;border-radius:14px;padding:9px 18px;
      font-size:13px;font-weight:700;color:#3d2b1f;
      box-shadow:0 6px 20px rgba(61,43,31,.18);
      animation:toast-in .3s ease-out,toast-out .3s ease-in 2s forwards;white-space:nowrap;
    }
    @keyframes toast-in{from{opacity:0;transform:translateY(-10px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes toast-out{from{opacity:1}to{opacity:0;transform:translateY(-8px)}}
  </style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>
<div class="phone">

  <!-- compactSelectionBar -->
  <div class="top-bar">
    <div class="top-row">
      <div class="app-logo">💛 METIME</div>
      <a class="journey-btn" href="journal.html">📖 Journey</a>
    </div>
    <div class="sections-scroll">
      <a class="sec-btn" href="hub.html"          style="--t:#E38A74"><span class="si">🏠</span> Casa</a>
      <a class="sec-btn" href="home-pet.html"      style="--t:#53A86A"><span class="si">🌲</span> Giardino</a>
      <a class="sec-btn" href="#"                  style="--t:#E98A56"><span class="si">🎮</span> Giochi</a>
      <a class="sec-btn" href="journal.html"       style="--t:#5A8BCF"><span class="si">📖</span> Diario</a>
      <a class="sec-btn active" href="shop.html"   style="--t:#C98053"><span class="si">🛒</span> Store</a>
      <a class="sec-btn" href="#"                  style="--t:#5E84C9"><span class="si">🎒</span> Zaino</a>
      <a class="sec-btn" href="#"                  style="--t:#A77BC7"><span class="si">🪑</span> Decora</a>
      <a class="sec-btn" href="#"                  style="--t:#D36F8E"><span class="si">☕</span> Me Time</a>
      <a class="sec-btn" href="care-ritual.html"   style="--t:#e8a0a0"><span class="si">💗</span> Rituale</a>
      <a class="sec-btn" href="#"                  style="--t:#8fa882"><span class="si">🗺️</span> Mappa</a>
      <a class="sec-btn" href="#"                  style="--t:#d4884a"><span class="si">🍴</span> Cucina</a>
      <a class="sec-btn" href="#"                  style="--t:#5a9a2e"><span class="si">🌿</span> Fattoria</a>
    </div>
  </div>

  <!-- careFocusPanel -->
  <div class="care-panel">
    <div class="care-header">
      <div class="care-title-col">
        <div class="care-title">Cura del pet</div>
        <div class="care-sub">Sta bene. Mantieni il ritmo con cura leggera.</div>
      </div>
      <div class="care-badges">
        <div class="cbadge" style="color:#5A8BCF">😊 Calmo</div>
        <div class="cbadge" style="color:#F59E0B">✨ Lv 3</div>
      </div>
    </div>
    <div class="needs-row">
      <div class="nbar">
        <div class="nbar-lbl" style="color:#F97316">🍴 <span>Fame</span></div>
        <div class="nbar-track" style="background:rgba(249,115,22,.15)">
          <div class="nbar-fill" style="width:58%;background:linear-gradient(to right,#F97316,rgba(249,115,22,.75))"></div>
        </div>
      </div>
      <div class="nbar">
        <div class="nbar-lbl" style="color:#EC4899">😊 <span>Umore</span></div>
        <div class="nbar-track" style="background:rgba(236,72,153,.15)">
          <div class="nbar-fill" style="width:72%;background:linear-gradient(to right,#EC4899,rgba(236,72,153,.75))"></div>
        </div>
      </div>
      <div class="nbar">
        <div class="nbar-lbl" style="color:#34D399">⚡ <span>Energia</span></div>
        <div class="nbar-track" style="background:rgba(52,211,153,.15)">
          <div class="nbar-fill" style="width:48%;background:linear-gradient(to right,#34D399,rgba(52,211,153,.75))"></div>
        </div>
      </div>
      <div class="nbar">
        <div class="nbar-lbl" style="color:#60A5FA">🌬️ <span>Calma</span></div>
        <div class="nbar-track" style="background:rgba(96,165,250,.15)">
          <div class="nbar-fill" style="width:65%;background:linear-gradient(to right,#60A5FA,rgba(96,165,250,.75))"></div>
        </div>
      </div>
    </div>
    <div class="acts-scroll">
      <button class="abt" onclick="location.href='home-pet.html'">
        <div class="acircle" style="background:linear-gradient(135deg,#F97316,rgba(249,115,22,.82))">🥕</div>
        <span class="albl" style="color:#F97316">Nutri</span>
      </button>
      <button class="abt" onclick="location.href='home-pet.html'">
        <div class="acircle" style="background:linear-gradient(135deg,#EC4899,rgba(236,72,153,.82))">🎮</div>
        <span class="albl" style="color:#EC4899">Gioca</span>
      </button>
      <button class="abt" onclick="location.href='home-pet.html'">
        <div class="acircle" style="background:linear-gradient(135deg,#60A5FA,rgba(96,165,250,.82))">✨</div>
        <span class="albl" style="color:#60A5FA">Calma</span>
      </button>
      <button class="abt" onclick="location.href='journal.html'">
        <div class="acircle" style="background:linear-gradient(135deg,#5A8BCF,rgba(90,139,207,.82))">📖</div>
        <span class="albl" style="color:#5A8BCF">Diario</span>
      </button>
      <button class="abt" onclick="location.href='care-ritual.html'">
        <div class="acircle" style="background:linear-gradient(135deg,#D36F8E,rgba(211,111,142,.82))">☕</div>
        <span class="albl" style="color:#D36F8E">Me Time</span>
      </button>
    </div>
  </div>

  <!-- Balance -->
  <div class="balance-bar">
    <div class="balance-item">🪙 <span id="coinsDisplay">100</span></div>
    <div class="balance-sep"></div>
    <div class="balance-item">💎 <span id="gemsDisplay">5</span></div>
  </div>

  <!-- Store content -->
  <div class="store-content">
    <div class="cat-tabs" id="catTabs">
      <button class="cat-tab active" data-cat="food">🔴 Cibo</button>
      <button class="cat-tab" data-cat="essentials">💙 Essenziali</button>
      <button class="cat-tab" data-cat="deco">💚 Decorazioni</button>
      <button class="cat-tab" data-cat="special">⭐ Speciali</button>
    </div>
    <div class="product-grid" id="productGrid"></div>
  </div>
</div>

<script>
(function() {
  const catalog = {
    food: [
      {id:'carrot', emoji:'🥕', name:'Carota',       desc:'Nutriente e croccante',       price:20,  coins:true,  bonus:'+20% Fame'},
      {id:'cookie', emoji:'🍪', name:'Biscotto',     desc:'Dolce sorpresa kawaii',        price:30,  coins:true},
      {id:'cake',   emoji:'🎂', name:'Torta',        desc:'Per le occasioni speciali',    price:80,  coins:true,  rare:true},
      {id:'tea',    emoji:'🍵', name:'Tè Calmante',  desc:'Rilassa e calma il pet',       price:45,  coins:true,  bonus:'+30% Calma'},
      {id:'apple',  emoji:'🍎', name:'Mela',         desc:'Fresca e vitaminica',          price:15,  coins:true},
      {id:'salad',  emoji:'🥗', name:'Insalata',     desc:'Leggera e sana',               price:25,  coins:true}
    ],
    essentials: [
      {id:'brush',  emoji:'🪮', name:'Spazzola',     desc:'Per un pelo lucente',          price:50,  coins:true},
      {id:'bed',    emoji:'🛏️', name:'Lettino',      desc:'Sonni tranquilli garantiti',   price:200, coins:true,  bonus:'+40% Energia'},
      {id:'toy',    emoji:'🧸', name:'Peluche',      desc:'Compagno di giochi',           price:60,  coins:true},
      {id:'lamp',   emoji:'🪔', name:'Lampada',      desc:'Luce soffusa per la sera',     price:80,  coins:true}
    ],
    deco: [
      {id:'plant',   emoji:'🪴', name:'Pianta',      desc:'Porta verde e serenità',       price:40,  coins:true},
      {id:'flower',  emoji:'🌸', name:'Fiori',       desc:'Colori primaverili',           price:35,  coins:true},
      {id:'rainbow', emoji:'🌈', name:'Arcobaleno',  desc:'Sticker speciale da muro',     price:3,   gems:true},
      {id:'stars',   emoji:'✨', name:'Stelle',      desc:'Decora il soffitto',           price:2,   gems:true}
    ],
    special: [
      {id:'magic', emoji:'🔮', name:'Cristallo',     desc:'Amplifica i poteri del pet',   price:5,   gems:true, rare:true},
      {id:'crown', emoji:'👑', name:'Corona',        desc:'Estetica VIP',                 price:8,   gems:true, rare:true},
      {id:'wings', emoji:'🦋', name:'Ali',           desc:'Il pet vola di felicità',      price:10,  gems:true},
      {id:'halo',  emoji:'😇', name:'Aureola',       desc:'Effetto angelico kawaii',      price:6,   gems:true}
    ]
  };

  function load(k, fb) { try { return JSON.parse(localStorage.getItem(k)); } catch(e) {} return fb; }
  let coins = load('metime_shop_coins', 100);
  let gems  = load('metime_shop_gems', 5);
  let purchased = new Set(load('metime_shop_purchased', []));
  let currentCat = 'food';

  function saveAll() {
    localStorage.setItem('metime_shop_coins', JSON.stringify(coins));
    localStorage.setItem('metime_shop_gems', JSON.stringify(gems));
    localStorage.setItem('metime_shop_purchased', JSON.stringify([...purchased]));
  }

  function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.getElementById('toastContainer').appendChild(t);
    setTimeout(() => t.remove(), 2500);
  }

  function updateBalance() {
    document.getElementById('coinsDisplay').textContent = coins;
    document.getElementById('gemsDisplay').textContent = gems;
  }

  function renderGrid() {
    const items = catalog[currentCat] || [];
    const grid = document.getElementById('productGrid');
    grid.innerHTML = items.map(item => {
      const isBought = purchased.has(item.id);
      const badge = item.rare
        ? '<span class="product-badge badge-rare">Raro</span>'
        : item.bonus
          ? '<span class="product-badge badge-bonus">' + item.bonus + '</span>'
          : '';
      const priceLabel = item.gems ? '💎 ' + item.price : '🪙 ' + item.price;
      return '<div class="product-card">' + badge +
        '<span class="product-emoji">' + item.emoji + '</span>' +
        '<div class="product-name">' + item.name + '</div>' +
        '<div class="product-desc">' + item.desc + '</div>' +
        '<div class="product-footer">' +
        '<span class="product-price">' + priceLabel + '</span>' +
        '<button class="buy-btn' + (isBought ? ' bought' : '') + '" data-id="' + item.id + '">' +
        (isBought ? '✓ Usato' : 'Acquista 🛒') +
        '</button></div></div>';
    }).join('');

    document.querySelectorAll('.buy-btn:not(.bought)').forEach(btn => {
      btn.addEventListener('click', () => {
        const item = items.find(i => i.id === btn.dataset.id);
        if (!item) return;
        if (item.gems) {
          if (gems < item.price) { showToast('💎 Gemme insufficienti!'); return; }
          gems -= item.price;
        } else {
          if (coins < item.price) { showToast('🪙 Monete insufficienti!'); return; }
          coins -= item.price;
        }
        purchased.add(item.id);
        saveAll(); updateBalance();
        showToast(item.emoji + ' ' + item.name + ' acquistato!');
        renderGrid();
      });
    });
  }

  document.querySelectorAll('.cat-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentCat = tab.dataset.cat;
      renderGrid();
    });
  });

  updateBalance();
  renderGrid();
})();
</script>
</body>
</html>
