<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>METIME - La tua Casa</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:linear-gradient(160deg,#F5B8CF 0%,#E8C4F0 50%,#D0B8F8 100%);
      min-height:100vh;display:flex;align-items:flex-start;justify-content:center;
      overflow-x:hidden;
    }
    .phone{
      width:390px;max-width:100vw;
      background:linear-gradient(160deg,#FFC4DC 0%,#ECD0F8 55%,#CAB8F4 100%);
      min-height:100vh;position:relative;overflow:hidden;
      display:flex;flex-direction:column;
    }
    /* sparkles */
    .spark{position:absolute;pointer-events:none;font-size:13px;opacity:.35;
      animation:spfloat 5s ease-in-out infinite alternate;}
    @keyframes spfloat{0%{transform:translateY(0) rotate(0deg)}100%{transform:translateY(-10px) rotate(18deg)}}

    /* header */
    .header{display:flex;align-items:center;justify-content:space-between;padding:50px 20px 10px;flex-shrink:0;}
    .header-title{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:800;color:#3A3060;}
    .header-badges{display:flex;gap:8px;}
    .badge{border-radius:20px;padding:5px 13px;font-size:14px;font-weight:700;
      display:flex;align-items:center;gap:5px;box-shadow:0 2px 8px rgba(0,0,0,.12);}
    .badge-coin{background:#FFD43B;color:#7A5500;}
    .badge-gem{background:#A87EE0;color:#fff;}

    /* room */
    .room{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    #house{width:390px;display:block;}

    /* action row */
    .act-row{padding:10px 18px 12px;flex-shrink:0;}
    .act-inner{background:#fff;border-radius:30px;display:flex;gap:8px;padding:10px 10px;
      box-shadow:0 4px 20px rgba(100,50,180,.12);}
    .act-btn{flex:1;border:none;border-radius:22px;padding:13px 6px;
      font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;
      justify-content:center;gap:6px;transition:transform .14s;}
    .act-btn:active{transform:scale(.93);}
    .btn-store{background:#FFB0C8;color:#7A1A40;}
    .btn-zaino{background:#90C8F8;color:#1A4A8A;}
    .btn-decora{background:#C8A0F8;color:#50108A;}

    /* tab bar */
    .tab-bar{background:rgba(255,255,255,.85);backdrop-filter:blur(10px);
      display:flex;border-top:1px solid rgba(200,180,240,.3);padding:8px 0 28px;flex-shrink:0;}
    .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
      font-size:11px;font-weight:600;color:#9A88B0;text-decoration:none;padding:6px 0;}
    .tab-item.active{color:#6A3EA0;}
    .tab-item .tab-icon{font-size:22px;}

    /* pet float */
    @keyframes petfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    #pet-g{animation:petfloat 2.8s ease-in-out infinite;}

    /* sparkle pulse */
    @keyframes spkpulse{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:.7;transform:scale(1.1)}}
  </style>
</head>
<body>
<div class="phone">
  <!-- bg sparkles -->
  <span class="spark" style="top:8%;left:7%;animation-delay:0s">✦</span>
  <span class="spark" style="top:14%;right:10%;animation-delay:.9s">⋆</span>
  <span class="spark" style="top:28%;left:5%;animation-delay:1.7s">★</span>
  <span class="spark" style="top:38%;right:6%;animation-delay:.5s">✦</span>
  <span class="spark" style="top:70%;left:8%;animation-delay:1.3s">⋆</span>
  <span class="spark" style="top:75%;right:9%;animation-delay:.2s">✧</span>
  <span class="spark" style="top:18%;left:48%;animation-delay:2.1s">♡</span>
  <span class="spark" style="top:58%;left:90%;animation-delay:1.5s">★</span>

  <!-- header -->
  <div class="header">
    <div class="header-title">
      <span>🏠</span><span>La tua Casa</span>
    </div>
    <div class="header-badges">
      <div class="badge badge-coin">🪙 100</div>
      <div class="badge badge-gem">💎 5</div>
    </div>
  </div>

  <!-- isometric room scene -->
  <div class="room">
    <svg id="house" viewBox="0 0 390 330" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- clip paths for walls -->
        <clipPath id="lwClip">
          <polygon points="195,50 75,110 75,215 195,155"/>
        </clipPath>
        <clipPath id="rwClip">
          <polygon points="195,50 315,110 315,215 195,155"/>
        </clipPath>
        <!-- pet gradient -->
        <radialGradient id="petGrad" cx="38%" cy="32%" r="62%">
          <stop offset="0%" stop-color="#C4A0F0"/>
          <stop offset="100%" stop-color="#7A50C0"/>
        </radialGradient>
        <!-- lamp glow -->
        <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(255,240,180,.35)"/>
          <stop offset="100%" stop-color="rgba(255,240,180,0)"/>
        </radialGradient>
      </defs>

      <!-- ═══ LEFT WALL (salmon + stripes) ═══ -->
      <polygon points="195,50 75,110 75,215 195,155" fill="#F2B498"/>
      <g clip-path="url(#lwClip)" opacity=".55">
        <rect x="85"  y="44" width="7" height="180" fill="#FDD8C0"/>
        <rect x="100" y="44" width="7" height="180" fill="#FDD8C0"/>
        <rect x="115" y="44" width="7" height="180" fill="#FDD8C0"/>
        <rect x="130" y="44" width="7" height="180" fill="#FDD8C0"/>
        <rect x="145" y="44" width="7" height="180" fill="#FDD8C0"/>
        <rect x="160" y="44" width="7" height="180" fill="#FDD8C0"/>
        <rect x="175" y="44" width="7" height="180" fill="#FDD8C0"/>
        <rect x="190" y="44" width="7" height="180" fill="#FDD8C0"/>
      </g>
      <polygon points="195,50 75,110 75,215 195,155" fill="none" stroke="#D09070" stroke-width="1.2"/>

      <!-- ═══ RIGHT WALL (lavender + stripes + window) ═══ -->
      <polygon points="195,50 315,110 315,215 195,155" fill="#D4B8EC"/>
      <g clip-path="url(#rwClip)" opacity=".5">
        <rect x="198" y="44" width="7" height="180" fill="#EAD4FC"/>
        <rect x="213" y="44" width="7" height="180" fill="#EAD4FC"/>
        <rect x="228" y="44" width="7" height="180" fill="#EAD4FC"/>
        <rect x="243" y="44" width="7" height="180" fill="#EAD4FC"/>
        <rect x="258" y="44" width="7" height="180" fill="#EAD4FC"/>
        <rect x="273" y="44" width="7" height="180" fill="#EAD4FC"/>
        <rect x="288" y="44" width="7" height="180" fill="#EAD4FC"/>
        <rect x="303" y="44" width="7" height="180" fill="#EAD4FC"/>
      </g>
      <!-- arched window on right wall -->
      <g clip-path="url(#rwClip)">
        <!-- arch + frame fill -->
        <path d="M238,110 Q258,75 278,110 L278,145 L238,145 Z" fill="#B09060"/>
        <!-- pane quadrants -->
        <rect x="240" y="110" width="16" height="17" rx="2" fill="#98CCDE"/>
        <rect x="259" y="110" width="16" height="17" rx="2" fill="#98CCDE"/>
        <rect x="240" y="129" width="16" height="14" rx="2" fill="#98CCDE"/>
        <rect x="259" y="129" width="16" height="14" rx="2" fill="#98CCDE"/>
        <!-- cross dividers -->
        <rect x="238" y="126" width="40" height="3"  fill="#B09060"/>
        <rect x="256" y="107" width="3"  height="38" fill="#B09060"/>
        <!-- arch border -->
        <path d="M238,110 Q258,75 278,110" fill="none" stroke="#C8A870" stroke-width="1.5"/>
        <!-- glass glare -->
        <rect x="241" y="111" width="5" height="7" rx="1" fill="rgba(255,255,255,.35)"/>
        <!-- window sill -->
        <rect x="235" y="144" width="46" height="5" rx="2" fill="#C8AA70"/>
      </g>
      <polygon points="195,50 315,110 315,215 195,155" fill="none" stroke="#A890C8" stroke-width="1.2"/>

      <!-- back corner ridge -->
      <line x1="195" y1="50" x2="195" y2="155" stroke="#C09870" stroke-width="1.5"/>
      <!-- top ridge -->
      <polyline points="75,110 195,50 315,110" fill="none" stroke="#C09870" stroke-width="1.8"/>

      <!-- ═══ FLOOR — 3×3 isometric tiles ═══ -->
      <!-- formula: fx=195+(col-row)*40, fy=155+(col+row)*20 -->
      <!-- points: fx,fy  fx+40,fy+20  fx,fy+40  fx-40,fy+20  -->

      <!-- row=0 -->
      <polygon points="195,155 235,175 195,195 155,175" fill="#EEE0A8" stroke="#D4C888" stroke-width=".8"/>
      <polygon points="235,175 275,195 235,215 195,195" fill="#F5ECC0" stroke="#D4C888" stroke-width=".8"/>
      <polygon points="275,195 315,215 275,235 235,215" fill="#EEE0A8" stroke="#D4C888" stroke-width=".8"/>
      <!-- row=1 -->
      <polygon points="155,175 195,195 155,215 115,195" fill="#F5ECC0" stroke="#D4C888" stroke-width=".8"/>
      <polygon points="195,195 235,215 195,235 155,215" fill="#EEE0A8" stroke="#D4C888" stroke-width=".8"/>
      <polygon points="235,215 275,235 235,255 195,235" fill="#F5ECC0" stroke="#D4C888" stroke-width=".8"/>
      <!-- row=2 -->
      <polygon points="115,195 155,215 115,235 75,215"  fill="#EEE0A8" stroke="#D4C888" stroke-width=".8"/>
      <polygon points="155,215 195,235 155,255 115,235" fill="#F5ECC0" stroke="#D4C888" stroke-width=".8"/>
      <polygon points="195,235 235,255 195,275 155,255" fill="#EEE0A8" stroke="#D4C888" stroke-width=".8"/>

      <!-- floor outer border -->
      <polygon points="195,155 315,215 195,275 75,215" fill="none" stroke="#C4AA60" stroke-width="1"/>

      <!-- ═══ LAMP (right side, near right wall) ═══ -->
      <g id="lamp">
        <!-- glow halo -->
        <ellipse cx="294" cy="198" rx="26" ry="14" fill="url(#lampGlow)"/>
        <!-- pole base shadow -->
        <ellipse cx="294" cy="227" rx="11" ry="4.5" fill="rgba(80,50,120,.12)"/>
        <!-- base disc -->
        <ellipse cx="294" cy="225" rx="10" ry="4" fill="#C8A870"/>
        <!-- pole -->
        <rect x="291" y="192" width="5" height="34" rx="2" fill="#C8AA78"/>
        <!-- shade lower curve -->
        <path d="M275,192 Q285,210 294,213 Q303,210 313,192" fill="#F4ECD8"/>
        <!-- shade top -->
        <ellipse cx="294" cy="191" rx="20" ry="7.5" fill="#F4ECD8"/>
        <!-- shade inner highlight -->
        <ellipse cx="291" cy="189" rx="8" ry="3" fill="rgba(255,255,230,.6)"/>
      </g>

      <!-- ═══ PLANT (left side, near left wall) ═══ -->
      <g id="plant">
        <!-- pot shadow -->
        <ellipse cx="96" cy="222" rx="13" ry="5" fill="rgba(80,50,120,.12)"/>
        <!-- pot -->
        <polygon points="84,215 87,222 105,222 108,215" fill="#C87850"/>
        <rect x="87" y="208" width="18" height="10" rx="2" fill="#D4905A"/>
        <!-- soil top -->
        <ellipse cx="96" cy="208" rx="9" ry="3.5" fill="#7A4A20"/>
        <!-- foliage layers (painter: back to front) -->
        <circle cx="97" cy="197" r="12" fill="#52A038"/>
        <circle cx="88" cy="193" r="11" fill="#5AAA3A"/>
        <circle cx="104" cy="193" r="10" fill="#48983A"/>
        <circle cx="96" cy="188" r="10" fill="#60B440"/>
        <!-- highlight -->
        <circle cx="91" cy="185" r="3.5" fill="rgba(255,255,255,.22)"/>
      </g>

      <!-- ═══ CUSHION/MAT (floor center, in front of pet) ═══ -->
      <g id="cushion">
        <ellipse cx="192" cy="258" rx="32" ry="12" fill="#E4C888" stroke="#D0B460" stroke-width=".8"/>
        <ellipse cx="192" cy="256" rx="27" ry="9"  fill="#EDD490"/>
        <text x="192" y="261" text-anchor="middle" font-size="8" fill="rgba(180,120,100,.5)">♥</text>
      </g>

      <!-- ═══ PET — purple cat blob (center floor) ═══ -->
      <g id="pet-g">
        <!-- shadow beneath pet -->
        <ellipse cx="190" cy="242" rx="27" ry="9" fill="rgba(80,40,160,.13)"/>
        <!-- body -->
        <ellipse cx="190" cy="226" rx="32" ry="28" fill="url(#petGrad)"/>
        <!-- left ear -->
        <polygon points="166,210 170,195 182,210" fill="#7A50C0"/>
        <!-- right ear -->
        <polygon points="198,210 210,195 214,210" fill="#7A50C0"/>
        <!-- ear inner -->
        <polygon points="168,209 171,198 180,209" fill="rgba(255,180,210,.45)"/>
        <polygon points="200,209 209,198 212,209" fill="rgba(255,180,210,.45)"/>
        <!-- eyes -->
        <circle cx="181" cy="223" r="5.5" fill="#261440"/>
        <circle cx="199" cy="223" r="5.5" fill="#261440"/>
        <!-- eye shine -->
        <circle cx="183" cy="221" r="2.2" fill="white"/>
        <circle cx="201" cy="221" r="2.2" fill="white"/>
        <!-- cheek blush -->
        <ellipse cx="172" cy="231" rx="7" ry="4" fill="rgba(255,150,175,.4)"/>
        <ellipse cx="208" cy="231" rx="7" ry="4" fill="rgba(255,150,175,.4)"/>
        <!-- nose -->
        <circle cx="190" cy="230" r="2.2" fill="#5A2A90"/>
        <!-- mouth -->
        <path d="M185,234 Q190,240 195,234" fill="none" stroke="#5A2A90" stroke-width="1.5" stroke-linecap="round"/>
      </g>

    </svg>
  </div>

  <!-- action buttons -->
  <div class="act-row">
    <div class="act-inner">
      <button class="act-btn btn-zaino"  onclick="showMsg('Il tuo zaino è vuoto! 🎒')">🎒 Zaino</button>
      <button class="act-btn btn-decora" onclick="showMsg('Modalità decora attivata! ✨')">✨ Decora</button>
    </div>
  </div>

  <!-- tab bar -->
  <nav class="tab-bar">
    <a class="tab-item" href="home-pet.html">
      <span class="tab-icon">🌿</span>
      <span>Giardino</span>
    </a>
    <a class="tab-item active" href="hub.html">
      <span class="tab-icon">🏠</span>
      <span>Casa</span>
    </a>
    <a class="tab-item" href="journal.html">
      <span class="tab-icon">📖</span>
      <span>Diario</span>
    </a>
    <a class="tab-item" href="shop.html">
      <span class="tab-icon">🛍</span>
      <span>Shop</span>
    </a>
  </nav>
</div>

<script>
function goTo(p){ window.location.href = p; }
function showMsg(m){ alert(m); }
</script>
</body>
</html>
