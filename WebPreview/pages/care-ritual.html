<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>METIME - Care Ritual</title>
  <link rel="stylesheet" href="../assets/kawaii.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(160deg, #FFF8F0 0%, #FDEAC0 50%, #FFD89B 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .phone-frame {
      width: 375px;
      min-height: 812px;
      background: linear-gradient(160deg, #FFF8F0 0%, #FDEAC0 55%, #FFD89B 100%);
      border-radius: 44px;
      box-shadow: 0 30px 80px rgba(200, 130, 50, 0.3), 0 0 0 1px rgba(255,255,255,0.4);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Nav */
    .top-nav {
      display: flex;
      align-items: center;
      padding: 20px 20px 12px;
      position: relative;
      z-index: 1;
    }
    .nav-back {
      font-size: 18px;
      font-weight: 700;
      color: #7a5a2a;
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.5);
    }
    .nav-title {
      flex: 1;
      text-align: center;
      font-size: 17px;
      font-weight: 800;
      color: #4a3010;
      margin-right: 44px;
    }

    /* Scrollable content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 32px;
      position: relative;
      z-index: 1;
    }
    .content::-webkit-scrollbar { display: none; }

    /* Page heading */
    .page-heading {
      font-size: 28px;
      font-weight: 800;
      color: #3a2010;
      margin-bottom: 6px;
    }
    .page-subtitle {
      font-size: 13px;
      color: #8a6a3a;
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    /* Breathing circle */
    .breath-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }
    .breath-circle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 32%, rgba(255,255,255,0.7) 0%, rgba(255,200,100,0.6) 50%, rgba(255,160,50,0.8) 100%);
      border: 3px solid rgba(255,180,80,0.5);
      box-shadow: 0 12px 40px rgba(200, 130, 50, 0.3), 0 0 60px rgba(255,200,100,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: breath-pulse 4s ease-in-out infinite;
      cursor: pointer;
      user-select: none;
    }
    .breath-circle.inhale { animation: breath-expand 4s ease-in-out forwards; }
    .breath-circle.exhale { animation: breath-shrink 4s ease-in-out forwards; }
    @keyframes breath-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 12px 40px rgba(200,130,50,0.3), 0 0 60px rgba(255,200,100,0.2); }
      50% { transform: scale(1.08); box-shadow: 0 18px 55px rgba(200,130,50,0.4), 0 0 80px rgba(255,200,100,0.35); }
    }
    @keyframes breath-expand {
      0% { transform: scale(1); }
      100% { transform: scale(1.12); }
    }
    @keyframes breath-shrink {
      0% { transform: scale(1.12); }
      100% { transform: scale(0.95); }
    }
    .breath-label {
      font-size: 18px;
      font-weight: 700;
      color: #5a3a10;
      margin-bottom: 8px;
    }
    .breath-timer {
      font-size: 40px;
      font-weight: 900;
      color: #3a2010;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1px;
    }

    /* Stats cards */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: rgba(255,255,255,0.6);
      border-radius: 18px;
      padding: 12px 10px;
      text-align: center;
      border: 1px solid rgba(255,200,100,0.4);
    }
    .stat-card-val {
      font-size: 13px;
      font-weight: 800;
      color: #c47820;
      line-height: 1.2;
    }
    .stat-card-label {
      font-size: 10px;
      font-weight: 600;
      color: #9a6a30;
      margin-top: 4px;
    }

    /* Conclude button */
    .conclude-btn {
      width: 100%;
      padding: 18px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      margin-bottom: 16px;
    }
    .conclude-btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .conclude-btn:active { transform: scale(0.98); }
    .conclude-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* Start button */
    .start-btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #FF9F4A, #FFB86C);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      margin-bottom: 20px;
      box-shadow: 0 6px 20px rgba(200, 130, 50, 0.35);
    }
    .start-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(200, 130, 50, 0.45); }
    .start-btn:active { transform: scale(0.97); }
    .start-btn.paused { background: linear-gradient(135deg, #aaa, #ccc); }

    /* Toast */
    .toast-overlay {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      border-radius: 20px;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 700;
      color: #3a2010;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .toast-overlay.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="toast-overlay" id="toast"></div>

  <div class="phone-frame">
    <div class="top-nav">
      <a class="nav-back" href="home-pet.html">&#8592;</a>
      <div class="nav-title">Care</div>
    </div>

    <div class="content">
      <div class="page-heading">Rituale di Cura</div>
      <div class="page-subtitle">Rituale di Cura &mdash; 4 minuti di respiro guidato per calmare il tuo pet</div>

      <!-- Breathing circle -->
      <div class="breath-area">
        <div class="breath-circle" id="breathCircle">
          <div class="breath-label" id="phaseLabel">Inspira</div>
          <div class="breath-timer" id="timerDisplay">04:00</div>
        </div>
      </div>

      <!-- Start / Pause button -->
      <button class="start-btn" id="startBtn">&#9654; Avvia Sessione</button>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-card-val">6 respiri/min</div>
          <div class="stat-card-label">Frequenza</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-val">Calmo +18%</div>
          <div class="stat-card-label">Mood previsto</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-val">+2 Semi Sereni</div>
          <div class="stat-card-label">Ricompensa</div>
        </div>
      </div>

      <!-- Conclude button -->
      <button class="conclude-btn" id="concludeBtn" disabled>Concludi Sessione</button>
    </div>
  </div>

  <script>
    const TOTAL = 4 * 60; // 4 minutes in seconds
    const MIN_SECONDS = 30; // minimum before can conclude
    const phases = ['Inspira', 'Tieni', 'Espira', 'Pausa'];
    const phaseDurations = [4, 2, 6, 2]; // box breathing

    let remaining = TOTAL;
    let elapsed = 0;
    let running = false;
    let interval = null;
    let phaseIdx = 0;
    let phaseRemaining = phaseDurations[0];

    const timerDisplay = document.getElementById('timerDisplay');
    const phaseLabel = document.getElementById('phaseLabel');
    const startBtn = document.getElementById('startBtn');
    const concludeBtn = document.getElementById('concludeBtn');
    const breathCircle = document.getElementById('breathCircle');
    const toast = document.getElementById('toast');

    function fmt(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function updatePhaseAnimation() {
      breathCircle.classList.remove('inhale', 'exhale');
      void breathCircle.offsetWidth;
      if (phases[phaseIdx] === 'Inspira') {
        breathCircle.classList.add('inhale');
      } else if (phases[phaseIdx] === 'Espira' || phases[phaseIdx] === 'Pausa') {
        breathCircle.classList.add('exhale');
      }
    }

    function tick() {
      elapsed++;
      remaining--;
      phaseRemaining--;

      if (phaseRemaining <= 0) {
        phaseIdx = (phaseIdx + 1) % phases.length;
        phaseRemaining = phaseDurations[phaseIdx];
        phaseLabel.textContent = phases[phaseIdx];
        updatePhaseAnimation();
      }

      timerDisplay.textContent = fmt(remaining);

      if (elapsed >= MIN_SECONDS) {
        concludeBtn.disabled = false;
      }

      if (remaining <= 0) {
        clearInterval(interval);
        running = false;
        startBtn.textContent = 'Sessione completata!';
        startBtn.classList.add('paused');
        concludeBtn.disabled = false;
        showToast('Sessione completata! 🌟 +2 Semi Sereni');
      }
    }

    startBtn.addEventListener('click', () => {
      if (remaining <= 0) return;
      if (running) {
        clearInterval(interval);
        running = false;
        startBtn.textContent = '▶ Riprendi';
        startBtn.classList.add('paused');
        breathCircle.style.animation = 'none';
      } else {
        running = true;
        startBtn.textContent = '⏸ Pausa';
        startBtn.classList.remove('paused');
        breathCircle.style.animation = '';
        updatePhaseAnimation();
        interval = setInterval(tick, 1000);
      }
    });

    concludeBtn.addEventListener('click', () => {
      if (concludeBtn.disabled) return;
      clearInterval(interval);
      running = false;
      showToast('Rituale completato! Calma +40% 💗');
      setTimeout(() => {
        window.location.href = 'home-pet.html';
      }, 2000);
    });
  </script>
</body>
</html>
