<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>METIME - Store</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#D8C8B4;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;}
    .phone{width:390px;max-width:100vw;min-height:100vh;background:#F5EDE0;overflow:hidden;display:flex;flex-direction:column;}
    .top-bar{padding:52px 16px 10px;background:#F5EDE0;flex-shrink:0;}
    .top-row{display:flex;align-items:center;margin-bottom:12px;}
    .app-logo{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:900;color:#2c1a0e;}
    .weather-btn{margin-left:auto;display:flex;align-items:center;gap:5px;padding:8px 16px;border-radius:999px;border:1.5px solid #F59E0B;background:rgba(255,255,255,.75);font-size:12px;font-weight:700;color:#D97706;cursor:pointer;}
    .sections-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
    .sections-scroll::-webkit-scrollbar{display:none;}
    .sec-btn{display:flex;align-items:center;gap:5px;padding:9px 14px;border-radius:999px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;background:rgba(255,255,255,.75);border:1.5px solid rgba(0,0,0,.08);text-decoration:none;transition:all .15s;flex-shrink:0;}
    .sec-btn[data-s="casa"]     {color:#B05050;}
    .sec-btn[data-s="giardino"] {color:#3A8A3A;}
    .sec-btn[data-s="giochi"]   {color:#6050B0;}
    .sec-btn[data-s="diario"]   {color:#3060A0;}
    .sec-btn[data-s="store"]    {color:#9A5020;}
    .sec-btn[data-s="zaino"]    {color:#4060A0;}
    .sec-btn[data-s="decora"]   {color:#8050B0;}
    .sec-btn[data-s="metime"]   {color:#B04070;}
    .sec-btn[data-s="rituale"]  {color:#B07070;}
    .sec-btn[data-s="mappa"]    {color:#507060;}
    .sec-btn[data-s="cucina"]   {color:#A05018;}
    .sec-btn[data-s="fattoria"] {color:#3A7010;}
    .sec-btn.active[data-s="store"]{background:#F8E8D4;border-color:transparent;}
    .si{font-size:14px;}
    .care-card{margin:4px 12px 10px;background:#fff;border-radius:22px;padding:14px 16px 12px;box-shadow:0 4px 18px rgba(61,43,31,.10);flex-shrink:0;}
    .care-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:3px;}
    .care-title{font-size:21px;font-weight:900;color:#2c1a0e;letter-spacing:-.3px;}
    .care-currency{display:flex;align-items:center;gap:8px;padding-top:3px;}
    .curr-item{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:800;color:#3d2b1f;}
    .care-subtitle{font-size:12px;color:#9a7a5a;font-weight:500;line-height:1.4;margin-bottom:12px;}
    .needs-row{display:flex;gap:6px;margin-bottom:13px;}
    .nbar{flex:1;display:flex;flex-direction:column;gap:5px;}
    .nbar-lbl{display:flex;align-items:center;gap:3px;font-size:10px;font-weight:700;}
    .nbar-track{height:7px;border-radius:999px;background:rgba(0,0,0,.07);overflow:hidden;}
    .nbar-fill{height:100%;border-radius:999px;}
    .acts-row{display:flex;justify-content:space-between;}
    .abt{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;border:0;background:none;cursor:pointer;padding:0;}
    .abt:active .acircle{transform:scale(.87);}
    .acircle{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .15s;box-shadow:0 4px 12px rgba(0,0,0,.13);}
    .albl{font-size:9.5px;font-weight:800;line-height:1.25;text-align:center;max-width:60px;}

    /* store content */
    .store-content{flex:1;overflow-y:auto;padding:12px 14px 0;}
    .store-content::-webkit-scrollbar{display:none;}
    .balance-bar{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 20px;background:#fff;margin-bottom:12px;border-radius:18px;box-shadow:0 2px 8px rgba(61,43,31,.07);}
    .balance-item{font-size:14px;font-weight:800;color:#3d2b1f;}
    .balance-sep{width:1px;height:16px;background:rgba(61,43,31,.15);}
    .cat-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;}
    .cat-tabs::-webkit-scrollbar{display:none;}
    .cat-tab{flex-shrink:0;padding:8px 16px;border-radius:999px;border:none;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.7);color:#5e4636;}
    .cat-tab.active{background:#fff;box-shadow:0 3px 10px rgba(61,43,31,.12);color:#3d2b1f;}
    .product-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:100px;}
    .product-card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 3px 14px rgba(61,43,31,.09);position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;}
    .product-badge{position:absolute;top:10px;right:10px;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:800;}
    .badge-bonus{background:linear-gradient(135deg,#FB923C,#F97316);color:#fff;}
    .badge-rare{background:linear-gradient(135deg,#A78BFA,#7C3AED);color:#fff;}
    .product-emoji{font-size:48px;margin-bottom:8px;margin-top:4px;display:block;}
    .product-name{font-size:14px;font-weight:800;color:#3d2b1f;margin-bottom:3px;}
    .product-desc{font-size:11px;color:#9a7a5a;font-weight:500;margin-bottom:10px;line-height:1.4;}
    .product-footer{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px;}
    .product-price{font-size:12px;font-weight:800;color:#a67c52;}
    .buy-btn{padding:7px 13px;background:linear-gradient(135deg,#F59E0B,#D97706);color:#fff;border:none;border-radius:999px;font-size:11px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 3px 10px rgba(217,119,6,.3);transition:transform .15s;}
    .buy-btn:active{transform:scale(.96);}
    .buy-btn.bought{background:linear-gradient(135deg,#aaa,#ccc);box-shadow:none;}

    .bottom-bar{display:flex;gap:8px;padding:10px 14px 28px;flex-shrink:0;background:#F5EDE0;}
    .bot-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 8px;border-radius:999px;border:none;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;transition:transform .13s;}
    .bot-btn:active{transform:scale(.92);}
    .bot-sfida   {background:#FFF3CC;color:#B07800;}
    .bot-shop    {background:#CCF0E8;color:#1A7060;}
    .bot-missioni{background:#EAD8F8;color:#6040A0;}
    .toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:100;pointer-events:none;}
    .toast{background:#fff;border-radius:14px;padding:9px 18px;font-size:13px;font-weight:700;color:#3d2b1f;box-shadow:0 6px 20px rgba(61,43,31,.18);animation:ti .3s ease-out,to .3s ease-in 2s forwards;white-space:nowrap;}
    @keyframes ti{from{opacity:0;transform:translateY(-10px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes to{from{opacity:1}to{opacity:0;transform:translateY(-8px)}}
  </style>
</head>
<body>
<div class="toast-container" id="tc"></div>
<div class="phone">
  <div class="top-bar">
    <div class="top-row">
      <div class="app-logo">🧡 METIME</div>
      <div class="weather-btn">☀️ Sunny</div>
    </div>
    <div class="sections-scroll">
      <a class="sec-btn"        data-s="casa"     href="hub.html"        ><span class="si">🏠</span> Casa</a>
      <a class="sec-btn"        data-s="giardino" href="home-pet.html"   ><span class="si">🌿</span> Giardino</a>
      <a class="sec-btn"        data-s="giochi"   href="#"               ><span class="si">🎮</span> Giochi</a>
      <a class="sec-btn"        data-s="diario"   href="journal.html"    ><span class="si">📖</span> Diario</a>
      <a class="sec-btn active" data-s="store"    href="shop.html"       ><span class="si">🛒</span> Store</a>
      <a class="sec-btn"        data-s="zaino"    href="#"               ><span class="si">🎒</span> Zaino</a>
      <a class="sec-btn"        data-s="decora"   href="#"               ><span class="si">🪑</span> Decora</a>
      <a class="sec-btn"        data-s="metime"   href="#"               ><span class="si">☕</span> Me Time</a>
      <a class="sec-btn"        data-s="rituale"  href="care-ritual.html"><span class="si">💗</span> Rituale</a>
      <a class="sec-btn"        data-s="mappa"    href="#"               ><span class="si">🗺️</span> Mappa</a>
      <a class="sec-btn"        data-s="cucina"   href="#"               ><span class="si">🍴</span> Cucina</a>
      <a class="sec-btn"        data-s="fattoria" href="#"               ><span class="si">🌾</span> Fattoria</a>
    </div>
  </div>
  <div class="care-card">
    <div class="care-top">
      <div class="care-title">Cura del pet</div>
      <div class="care-currency">
        <div class="curr-item">🪙 <span id="coinsDisplay">240</span></div>
        <div class="curr-item">⭐ Lv. 2</div>
      </div>
    </div>
    <div class="care-subtitle">Fai felice il tuo pet e guardalo crescere!</div>
    <div class="needs-row">
      <div class="nbar"><div class="nbar-lbl" style="color:#F97316">🍖 <span>Fame</span></div><div class="nbar-track"><div class="nbar-fill" style="width:65%;background:linear-gradient(to right,#FB923C,#F97316)"></div></div></div>
      <div class="nbar"><div class="nbar-lbl" style="color:#EC4899">💗 <span>Amore</span></div><div class="nbar-track"><div class="nbar-fill" style="width:45%;background:linear-gradient(to right,#F472B6,#EC4899)"></div></div></div>
      <div class="nbar"><div class="nbar-lbl" style="color:#34D399">⚡ <span>Energia</span></div><div class="nbar-track"><div class="nbar-fill" style="width:80%;background:linear-gradient(to right,#6EE7B7,#34D399)"></div></div></div>
      <div class="nbar"><div class="nbar-lbl" style="color:#60A5FA">💧 <span>Igiene</span></div><div class="nbar-track"><div class="nbar-fill" style="width:28%;background:linear-gradient(to right,#93C5FD,#60A5FA)"></div></div></div>
    </div>
    <div class="acts-row">
      <button class="abt"><div class="acircle" style="background:linear-gradient(145deg,#FB923C,#EA6A0A)">🥕</div><span class="albl" style="color:#F97316">Nutrì</span></button>
      <button class="abt"><div class="acircle" style="background:linear-gradient(145deg,#F472B6,#DA1E8A)">💗</div><span class="albl" style="color:#EC4899">Gioca</span></button>
      <button class="abt"><div class="acircle" style="background:linear-gradient(145deg,#A78BFA,#7C3AED)">✨</div><span class="albl" style="color:#8B5CF6">Coccola</span></button>
      <button class="abt"><div class="acircle" style="background:linear-gradient(145deg,#60A5FA,#2563EB)">🛁</div><span class="albl" style="color:#3B82F6">Pulisci</span></button>
      <button class="abt"><div class="acircle" style="background:linear-gradient(145deg,#34D399,#059669)">🌙</div><span class="albl" style="color:#10B981">Metti a nanna</span></button>
    </div>
  </div>
  <div class="store-content">
    <div class="balance-bar">
      <div class="balance-item">🪙 <span id="coins">240</span></div>
      <div class="balance-sep"></div>
      <div class="balance-item">💎 <span id="gems">5</span></div>
    </div>
    <div class="cat-tabs" id="catTabs">
      <button class="cat-tab active" data-cat="food">🔴 Cibo</button>
      <button class="cat-tab" data-cat="essentials">💙 Essenziali</button>
      <button class="cat-tab" data-cat="deco">💚 Decorazioni</button>
      <button class="cat-tab" data-cat="special">⭐ Speciali</button>
    </div>
    <div class="product-grid" id="productGrid"></div>
  </div>
  <div class="bottom-bar">
    <button class="bot-btn bot-sfida">🏆 Sfida</button>
    <button class="bot-btn bot-shop">🛍 Shop</button>
    <button class="bot-btn bot-missioni">⭐ Missioni</button>
  </div>
</div>
<script>
(function(){
  const catalog={
    food:[
      {id:'carrot',emoji:'🥕',name:'Carota',desc:'Nutriente e croccante',price:20,coins:true,bonus:'+20% Fame'},
      {id:'cookie',emoji:'🍪',name:'Biscotto',desc:'Dolce sorpresa kawaii',price:30,coins:true},
      {id:'cake',emoji:'🎂',name:'Torta',desc:'Per le occasioni speciali',price:80,coins:true,rare:true},
      {id:'tea',emoji:'🍵',name:'Tè Calmante',desc:'Rilassa e calma il pet',price:45,coins:true,bonus:'+30% Calma'},
      {id:'apple',emoji:'🍎',name:'Mela',desc:'Fresca e vitaminica',price:15,coins:true},
      {id:'salad',emoji:'🥗',name:'Insalata',desc:'Leggera e sana',price:25,coins:true}
    ],
    essentials:[
      {id:'brush',emoji:'🪮',name:'Spazzola',desc:'Per un pelo lucente',price:50,coins:true},
      {id:'bed',emoji:'🛏️',name:'Lettino',desc:'Sonni tranquilli garantiti',price:200,coins:true,bonus:'+40% Energia'},
      {id:'toy',emoji:'🧸',name:'Peluche',desc:'Compagno di giochi',price:60,coins:true},
      {id:'lamp',emoji:'🪔',name:'Lampada',desc:'Luce soffusa per la sera',price:80,coins:true}
    ],
    deco:[
      {id:'plant',emoji:'🪴',name:'Pianta',desc:'Porta verde e serenità',price:40,coins:true},
      {id:'flower',emoji:'🌸',name:'Fiori',desc:'Colori primaverili',price:35,coins:true},
      {id:'rainbow',emoji:'🌈',name:'Arcobaleno',desc:'Sticker speciale da muro',price:3,gems:true},
      {id:'stars',emoji:'✨',name:'Stelle',desc:'Decora il soffitto',price:2,gems:true}
    ],
    special:[
      {id:'magic',emoji:'🔮',name:'Cristallo',desc:'Amplifica i poteri del pet',price:5,gems:true,rare:true},
      {id:'crown',emoji:'👑',name:'Corona',desc:'Estetica VIP',price:8,gems:true,rare:true},
      {id:'wings',emoji:'🦋',name:'Ali',desc:'Il pet vola di felicità',price:10,gems:true},
      {id:'halo',emoji:'😇',name:'Aureola',desc:'Effetto angelico kawaii',price:6,gems:true}
    ]
  };
  function load(k,fb){try{return JSON.parse(localStorage.getItem(k));}catch(e){}return fb;}
  let coins=load('metime_coins',240),gems=load('metime_gems',5);
  let purchased=new Set(load('metime_purchased',[]));
  let currentCat='food';
  function save(){localStorage.setItem('metime_coins',JSON.stringify(coins));localStorage.setItem('metime_gems',JSON.stringify(gems));localStorage.setItem('metime_purchased',JSON.stringify([...purchased]));}
  function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.getElementById('tc').appendChild(t);setTimeout(()=>t.remove(),2500);}
  function updateBal(){document.getElementById('coins').textContent=coins;document.getElementById('gems').textContent=gems;}
  function render(){
    const items=catalog[currentCat]||[];
    document.getElementById('productGrid').innerHTML=items.map(it=>{
      const b=it.rare?'<span class="product-badge badge-rare">Raro</span>':it.bonus?'<span class="product-badge badge-bonus">'+it.bonus+'</span>':'';
      const p=it.gems?'💎 '+it.price:'🪙 '+it.price;
      const bought=purchased.has(it.id);
      return'<div class="product-card">'+b+'<span class="product-emoji">'+it.emoji+'</span><div class="product-name">'+it.name+'</div><div class="product-desc">'+it.desc+'</div><div class="product-footer"><span class="product-price">'+p+'</span><button class="buy-btn'+(bought?' bought':'')+'" data-id="'+it.id+'">'+(bought?'✓ Usato':'Acquista 🛒')+'</button></div></div>';
    }).join('');
    document.querySelectorAll('.buy-btn:not(.bought)').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const it=items.find(i=>i.id===btn.dataset.id);if(!it)return;
        if(it.gems){if(gems<it.price){toast('💎 Gemme insufficienti!');return;}gems-=it.price;}
        else{if(coins<it.price){toast('🪙 Monete insufficienti!');return;}coins-=it.price;}
        purchased.add(it.id);save();updateBal();toast(it.emoji+' '+it.name+' acquistato!');render();
      });
    });
  }
  document.querySelectorAll('.cat-tab').forEach(tab=>{
    tab.addEventListener('click',()=>{
      document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');currentCat=tab.dataset.cat;render();
    });
  });
  updateBal();render();
})();
</script>
</body>
</html>
